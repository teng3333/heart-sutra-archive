name: Build track pages

# 曲ごとの共有ページ(t/<id>.html)を、公開中の曲に合わせて作り直す(2026-09-16)。
# 投稿はサーバー側で自動公開される。ここではAPIから公開中の曲を読み、
# SNSのカード用のページを作り直して、変わったときだけコミットする。
# 曲ページ(track.html)・棚・アーカイブはAPIを直接読むので、このワークフローを待たずに載る。
#
# 間隔について(2026-09-20 に 1日1回 → 15分ごとへ変更):
#   1日1回にしたのは、1回走るごとにバックエンドへ107回問い合わせていたから
#   (棚2回 + 曲を1つずつ105回)。
#   /api/archive は公開中の曲を1回で返し、しかもページ作りに要る項目を全部持っている
#   (2026-09-20 に /api/track と突き合わせて実測。出来上がるページも1バイト違わない)。
#   107回 → 1回になったので、15分ごとでも1日96回で済む。
#   30分ごとだった頃は1日5,100回だったので、それより遥かに軽い。
#
#   間隔を詰めたのは、公開されてから曲ページができるまでの穴を塞ぐため。
#   投稿が自動で公開されるようになると、「公開はされたがページが無い」時間が生まれ、
#   投稿の着地点が渡すリンクが切れる。1日1回だと、その穴が最大24時間あいてしまう。
#
#   急ぐときは workflow_dispatch(Actionsの「Run workflow」)で手でも走らせられる。
#
# 予約実行は当てにならない(2026-09-20 実測):
#   cron に */15 と書いてあるが、実際に走ったのは
#   00:02 / 12:48(手動) / 14:42 / 17:41 / 19:47 / 22:13 で、間隔は 2h06m〜2h59m。
#   GitHubは予約実行を間引くので、この指定は「最短15分」でしかない。
#   そのため、投稿者が人に渡せる住所(t/<id>.html)を得るまで数時間かかることがある。
#   submit.html の案内はこの実態に合わせてある(「数時間のうちに」)。
#   本当に直すなら、公開したときにバックエンドから repository_dispatch を撃って
#   このワークフローを起こす形にする。トークンの用意が要るので、まだやっていない。

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-track-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build track pages from the public API
        run: python3 tools/build_track_pages.py
      # 安全装置(関門)に掛かると上の手順が失敗で止まるので、ここまで来ない。
      # 書き出した分も一緒に捨てられるが、次の回に全曲取れればまとめて載る。
      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain t/)" ]; then
            echo "変更なし"
            exit 0
          fi
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add t/
          git commit -m "chore: rebuild track pages [$(date -u '+%Y-%m-%d %H:%M')]"
          git push
