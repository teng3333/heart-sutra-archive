<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive — Open Gate Sutra</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="description" content="Every Heart Sutra in the hall. Search by title, artist, genre — or by what AN heard in it.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Open Gate Sutra">
<meta property="og:title" content="Archive — Open Gate Sutra">
<meta property="og:description" content="堂に入ったすべての般若心経。曲名・作者名・ジャンル・ANの曲評から探せます。">
<meta property="og:url" content="https://teng3333.github.io/heart-sutra-archive/archive.html">
<meta property="og:image" content="https://teng3333.github.io/heart-sutra-archive/assets/og-card.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://teng3333.github.io/heart-sutra-archive/assets/og-card.jpg">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ai:#131a26; --ai-deep:#0d1220; --washi:#d9c49a; --washi-hi:#e9dcba;
    --shu:#b23a2e; --ruri:#6fa8d6; --nibi:#8d826d;
    --hair:rgba(217,196,154,.18); --hair2:rgba(217,196,154,.34);
    --ja:"Shippori Mincho","Hiragino Mincho ProN",serif;
    --en:"Cormorant Garamond",Georgia,serif;
    --ui:ui-sans-serif,-apple-system,"Hiragino Sans",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#03050a;color:var(--washi);font-family:var(--ui);
    -webkit-font-smoothing:antialiased;line-height:1.7}
  body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(120% 80% at 50% -10%,rgba(19,26,38,.9),transparent 62%)}
  a{color:inherit}

  header{position:relative;z-index:1;display:flex;align-items:center;gap:16px;
    padding:16px 22px;border-bottom:1px solid var(--hair)}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;flex:1;min-width:0}
  .logo{display:flex;font-family:var(--ja);font-size:11px;line-height:1.15;
    color:var(--washi-hi);border:1px solid var(--hair2);padding:4px 5px;letter-spacing:.06em}
  .logo span{display:block}
  .brand h2{font-family:var(--en);font-size:14px;font-weight:400;letter-spacing:.2em;margin:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand small{display:block;font-family:var(--ja);font-size:9.5px;color:var(--nibi);
    letter-spacing:.14em;margin-top:2px}
  .back{font-family:var(--en);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--nibi);text-decoration:none;white-space:nowrap}
  .back:hover{color:var(--washi)}

  main{position:relative;z-index:1;max-width:70rem;margin:0 auto;padding:34px 22px 90px}
  .lead{font-family:var(--en);font-size:11px;letter-spacing:.3em;text-transform:uppercase;
    color:var(--nibi);margin:0}
  h1{font-family:var(--ja);font-size:clamp(22px,4vw,30px);font-weight:500;
    color:var(--washi-hi);margin:10px 0 0}
  .h-sub{font-size:12.5px;color:var(--nibi);margin:8px 0 0}

  /* ── 探す ── */
  .find{margin:26px 0 0;position:sticky;top:0;z-index:2;
    background:linear-gradient(#03050a 72%,rgba(3,5,10,0));padding:12px 0 16px}
  .q{position:relative}
  .q input{width:100%;background:rgba(13,18,32,.66);color:var(--washi-hi);font:inherit;
    font-size:15px;border:1px solid var(--hair2);padding:13px 40px 13px 15px;
    backdrop-filter:blur(4px)}
  .q input::placeholder{color:var(--nibi)}
  .q input:focus{outline:none;border-color:var(--washi)}
  .q .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);
    background:none;border:0;color:var(--nibi);font:inherit;font-size:17px;
    cursor:pointer;padding:6px 10px;display:none}
  .q.has .clear{display:block}
  .q .clear:hover{color:var(--washi)}

  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
  .chip{background:rgba(13,18,32,.55);border:1px solid var(--hair);color:var(--nibi);
    font:inherit;font-size:11.5px;padding:6px 13px;cursor:pointer;white-space:nowrap}
  .chip:hover{border-color:var(--hair2);color:var(--washi)}
  .chip[aria-pressed="true"]{border-color:var(--washi);color:var(--washi-hi);
    background:rgba(217,196,154,.1)}
  .chip b{font-weight:400;opacity:.55;margin-left:5px;font-size:10.5px}
  .chip-sep{width:1px;background:var(--hair);margin:2px 4px}

  .bar{display:flex;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap;
    font-size:11.5px;color:var(--nibi)}
  .bar .grow{flex:1}
  .bar select{background:rgba(13,18,32,.6);color:var(--washi);font:inherit;font-size:11.5px;
    border:1px solid var(--hair);padding:5px 8px}
  .bar a.play{border:1px solid var(--hair2);color:var(--washi);text-decoration:none;
    padding:6px 14px;font-size:11.5px;white-space:nowrap}
  .bar a.play:hover{border-color:var(--washi)}

  /* ── 一覧 ── */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));
    gap:20px 16px;margin-top:26px}
  .card{display:block;text-decoration:none;color:inherit}
  .card .sq{position:relative;aspect-ratio:1;border:1px solid var(--hair2);overflow:hidden;
    background:rgba(13,18,32,.55);transition:border-color .18s}
  .card:hover .sq{border-color:var(--washi)}
  .card:focus-visible .sq{outline:2px solid var(--ruri);outline-offset:2px}
  .card .sq img{width:100%;height:100%;object-fit:cover;display:block}
  .card .mode{position:absolute;left:0;bottom:0;font-family:var(--ja);font-size:10px;
    letter-spacing:.14em;padding:3px 7px;background:rgba(3,5,10,.82);color:var(--washi-hi)}
  .card h3{font-family:var(--ja);font-size:13px;font-weight:400;color:var(--washi-hi);
    margin:9px 0 0;line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .who{font-size:11px;color:var(--nibi);margin:3px 0 0}
  .card .why{font-size:10px;color:var(--shu);margin:4px 0 0;letter-spacing:.06em}

  .state{font-family:var(--ja);font-size:14px;color:var(--nibi);line-height:2.1;
    padding:56px 0;text-align:center}
  .state b{display:block;font-family:var(--en);font-size:12px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--washi);margin-bottom:10px}
  .state .gates{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap}
  .state .gates a{border:1px solid var(--hair2);padding:10px 20px;text-decoration:none;
    font-size:12px}
  .state .gates a:hover{border-color:var(--washi)}

  @media (max-width:560px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:16px 12px}
  }
</style>
  <!-- Cookie同意 + GA4(同意後にのみ読み込む・GDPR) -->
  <script src="src/js/consent.js?v=3" defer></script>
</head>
<body>
<header>
  <a class="brand" href="./">
    <span class="logo" aria-hidden="true"><span>開</span><span>羯</span><span>諦</span><span>経</span></span>
    <span><h2>Open Gate Sutra<small>ひらかれた般若心経の家</small></h2></span>
  </a>
  <a class="back" href="./">← Home</a>
</header>

<main>
  <p class="lead">Archive — 堂</p>
  <h1>堂に入ったすべての般若心経</h1>
  <p class="h-sub">曲名・作者名・ジャンル、そしてANが聴きとったことばからも探せます。</p>

  <div class="find">
    <div class="q" id="qWrap">
      <input type="search" id="q" autocomplete="off" spellcheck="false"
             placeholder="曲名・作者名・ジャンル・ANの曲評から探す…"
             aria-label="曲を探す">
      <button class="clear" type="button" id="qClear" aria-label="消す">×</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="棚とジャンルで絞る"></div>
    <div class="bar">
      <span id="count"></span>
      <span class="grow"></span>
      <label>並び
        <select id="sort">
          <option value="new">新しい順</option>
          <option value="title">曲名順</option>
          <option value="artist">作者順</option>
          <option value="random">ばらばら</option>
        </select>
      </label>
      <a class="play" id="playAll" href="listen.html">この棚を流す</a>
    </div>
  </div>

  <p class="state" id="state"><b>Opening…</b>堂をひらいています。</p>
  <div class="grid" id="grid"></div>
</main>

<script>
(function () {
  'use strict';

  /* 手元(localhost)で開いたときは手元のAPIを見る。本番では本番のAPI(投稿ページと同じ書き方) */
  var API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? 'http://127.0.0.1:5001'
    : 'https://open-gate-sutra-production.up.railway.app';
  var API = API_BASE + '/api/archive';
  var all = [], genres = [];
  var q = document.getElementById('q');
  var qWrap = document.getElementById('qWrap');
  var grid = document.getElementById('grid');
  var state = document.getElementById('state');
  var chips = document.getElementById('chips');
  var sortSel = document.getElementById('sort');
  var countEl = document.getElementById('count');
  var playAll = document.getElementById('playAll');

  var pick = { axis: '', genre: '' };

  function say(head, body, gates){
    state.innerHTML = '<b>' + head + '</b>' + body +
      (gates ? '<span class="gates"><a href="listen.html?gate=sei">静の棚を流す</a>' +
               '<a href="listen.html?gate=do">動の棚を流す</a>' +
               '<a href="submit.html">自分の般若心経を渡す</a></span>' : '');
    state.hidden = false;
    grid.innerHTML = '';
  }

  fetch(API)
    .then(function(r){ if (!r.ok) throw 0; return r.json(); })
    .then(function(d){
      all = d.items || [];
      genres = d.genres || [];
      if (!all.length){
        say('The hall is quiet.', 'まだ曲がありません。'); return;
      }
      buildChips();
      readUrl();
      apply();
    })
    .catch(function(){
      say('Could not reach the hall.', 'つながりませんでした。時間をおいてお試しください。');
    });

  var AXES = [['', 'すべて'], ['sei', '静'], ['do', '動']];

  function buildChips(){
    chips.innerHTML = '';
    AXES.forEach(function(a){
      chips.appendChild(chip(a[1], null, 'axis', a[0]));
    });
    var sep = document.createElement('span');
    sep.className = 'chip-sep';
    chips.appendChild(sep);
    chips.appendChild(chip('ジャンル問わず', null, 'genre', ''));
    genres.forEach(function(g){
      chips.appendChild(chip(g.name, g.count, 'genre', g.name));
    });
  }

  function chip(label, n, kind, value){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.textContent = label;
    if (n) { var s = document.createElement('b'); s.textContent = n; b.appendChild(s); }
    b.addEventListener('click', function(){
      pick[kind] = (pick[kind] === value) ? '' : value;
      apply();
    });
    b.dataset.kind = kind; b.dataset.value = value;
    return b;
  }

  function syncChips(){
    [].forEach.call(chips.children, function(b){
      if (!b.dataset) return;
      b.setAttribute('aria-pressed', String(pick[b.dataset.kind] === b.dataset.value));
    });
  }

  function norm(s){
    return (s || '').toLowerCase()
      // 全角と半角、大小を揃える。打ち方の違いで見つからないのを防ぐ
      .replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(c){
        return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).toLowerCase();
  }

  /* 当たった場所を返す。曲評だけで当たった曲には、その旨を出す。
     曲名にも作者名にも無い語で出てくると、なぜ出たのか分からなくなる */
  function match(t, words){
    var head = norm([t.title, t.artist_name, t.genre, t.subgenre,
                     (t.languages || []).join(' '), t.genre_group].join(' '));
    var body = norm([t.an_comment, t.good_points].join(' '));
    var inHead = words.every(function(w){ return head.indexOf(w) >= 0; });
    if (inHead) return 'head';
    var all = head + ' ' + body;
    if (words.every(function(w){ return all.indexOf(w) >= 0; })) return 'body';
    return null;
  }

  function apply(){
    var raw = q.value.trim();
    qWrap.classList.toggle('has', !!raw);
    var words = norm(raw).split(/\s+/).filter(Boolean);

    var out = [];
    all.forEach(function(t){
      if (pick.axis && t.axis !== pick.axis) return;
      if (pick.genre && t.genre_group !== pick.genre) return;
      var why = words.length ? match(t, words) : 'head';
      if (!why) return;
      out.push({ t: t, why: why });
    });

    var how = sortSel.value;
    if (how === 'title') out.sort(function(a,b){ return a.t.title.localeCompare(b.t.title, 'ja'); });
    else if (how === 'artist') out.sort(function(a,b){
      return (a.t.artist_name||'').localeCompare(b.t.artist_name||'', 'ja'); });
    else if (how === 'random') out.sort(function(){ return Math.random() - 0.5; });
    // 新しい順は、返ってきた並びがすでにそれなので何もしない

    render(out);
    writeUrl();
    syncChips();
  }

  function render(out){
    countEl.textContent = out.length + ' / ' + all.length + ' 曲';
    playAll.href = 'listen.html' + (pick.axis ? '?gate=' + pick.axis : '');
    playAll.textContent = pick.axis === 'sei' ? '静の棚を流す'
                        : pick.axis === 'do' ? '動の棚を流す' : '棚を流す';

    if (!out.length){
      say('Nothing here.',
          'その言葉では見つかりませんでした。<br>綴りを変えるか、下から入ってみてください。', true);
      return;
    }
    state.hidden = true;

    var f = document.createDocumentFragment();
    out.forEach(function(o){
      var t = o.t;
      var a = document.createElement('a');
      a.className = 'card';
      a.href = 't/' + t.id + '.html';

      var sq = document.createElement('div');
      sq.className = 'sq';
      if (t.artwork_url){
        var img = document.createElement('img');
        img.src = t.artwork_url; img.alt = ''; img.loading = 'lazy';
        sq.appendChild(img);
      }
      var m = document.createElement('span');
      m.className = 'mode';
      m.textContent = (t.axis_label_ja || '') + ' ' + (t.mode_label_ja || '');
      sq.appendChild(m);
      a.appendChild(sq);

      var h = document.createElement('h3');
      h.textContent = t.title || '';
      a.appendChild(h);

      var w = document.createElement('p');
      w.className = 'who';
      w.textContent = t.artist_name || '';
      a.appendChild(w);

      if (o.why === 'body'){
        var y = document.createElement('p');
        y.className = 'why';
        y.textContent = '曲評に一致';
        a.appendChild(y);
      }
      f.appendChild(a);
    });
    grid.innerHTML = '';
    grid.appendChild(f);
  }

  /* 絞った状態を住所に残す。共有でき、戻るボタンでも壊れない */
  function writeUrl(){
    var p = new URLSearchParams();
    if (q.value.trim()) p.set('q', q.value.trim());
    if (pick.axis) p.set('gate', pick.axis);
    if (pick.genre) p.set('genre', pick.genre);
    if (sortSel.value !== 'new') p.set('sort', sortSel.value);
    var s = p.toString();
    history.replaceState(null, '', location.pathname + (s ? '?' + s : ''));
  }
  function readUrl(){
    var p = new URLSearchParams(location.search);
    q.value = p.get('q') || '';
    // 曲のページから「この作者の曲」で来たときは、名前で絞った状態にする
    if (!q.value && p.get('artist')) q.value = p.get('artist');
    pick.axis = p.get('gate') === 'do' || p.get('gate') === 'sei' ? p.get('gate') : '';
    pick.genre = p.get('genre') || '';
    if (p.get('sort')) sortSel.value = p.get('sort');
  }

  var timer = 0;
  q.addEventListener('input', function(){
    clearTimeout(timer);
    timer = setTimeout(apply, 90);      // 打鍵ごとの描き直しを少しだけ間引く
  });
  document.getElementById('qClear').addEventListener('click', function(){
    q.value = ''; apply(); q.focus();
  });
  sortSel.addEventListener('change', apply);
  window.addEventListener('popstate', function(){ readUrl(); apply(); });
})();
</script>
  <script src="src/js/app.js"></script>
  <script src="src/js/chat.js"></script>
  
  <!-- AN Mikuji Launcher -->
  <a id="mikuji-launcher" href="an-mikuji.html" aria-label="AN神籤を引く" title="AN神籤 — 今日の運勢を占う">
    <img src="assets/covers/mikuji_icon.webp" alt="AN Mikuji">
  </a>
  </span>
</body>
</html>
