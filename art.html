<style>
  :root{--washi:#d9c49a;--washi-hi:#e9dcba;--nibi:#8d826d;--shu:#b23a2e;
    --hair:rgba(217,196,154,.16);
    --en:"Cormorant Garamond","Georgia",serif;
    --ja:"Shippori Mincho","Hiragino Mincho ProN",serif;
    --ui:ui-sans-serif,-apple-system,"Helvetica Neue",sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#04060b;color:var(--washi);
    font-family:var(--en);-webkit-font-smoothing:antialiased;overflow:hidden}

  /* 鑑賞の邪魔をしない最小限のUI。数秒で静かに退く */
  .veil-ui{position:fixed;inset:0;z-index:5;pointer-events:none;
    transition:opacity .9s ease}
  body.idle .veil-ui{opacity:0}

  /* Homeへ戻る導線。左下(携帯は右下)の操作列 Sound(14) → Motion(56) の上に積む。
     鑑賞UIが退いても消えないよう .veil-ui の外に置く */
  .home-btn{position:fixed;left:14px;bottom:98px;z-index:9997;
    display:inline-flex;align-items:center;gap:8px;text-decoration:none;
    color:var(--nibi);font-family:var(--ui);font-size:10px;line-height:1;
    letter-spacing:.18em;text-transform:uppercase;padding:8px 12px;
    background:rgba(6,9,16,.72);border:1px solid rgba(217,196,154,.16);
    backdrop-filter:blur(4px);transition:color .3s,border-color .3s}
  .home-btn:hover{color:var(--washi);border-color:rgba(217,196,154,.4)}
  .home-btn:focus-visible{outline:1px solid var(--washi);outline-offset:3px}
  @media (max-width:700px){
    .home-btn{left:auto;right:10px;bottom:82px;padding:7px 9px;font-size:9px}
  }

  .title{position:fixed;left:0;right:0;bottom:74px;text-align:center;
    pointer-events:none;padding:0 20px}
  .title h1{font-weight:300;font-size:clamp(20px,3.4vw,32px);
    letter-spacing:.06em;color:var(--washi-hi);text-shadow:0 2px 24px rgba(4,6,11,.9)}
  .title p{font-family:var(--ja);font-size:11px;letter-spacing:.34em;
    color:var(--nibi);margin-top:10px;text-shadow:0 2px 18px rgba(4,6,11,.9)}
  .title small{display:block;font-family:var(--ui);font-size:9px;letter-spacing:.2em;
    color:#5c5442;margin-top:14px;text-transform:uppercase}
  /* 携帯は操作列が3段になるぶん、キャプションを上へ逃がす */
  @media (max-width:700px){ .title{bottom:124px} }
</style>
</head>
<body>

<a class="home-btn" href="./" aria-label="ホームに戻る"><span aria-hidden="true">←</span> Home</a>

<div class="veil-ui">
  <div class="title">
    <h1>Nothing here repeats.</h1>
    <p>諸行無常 — 二度と同じ姿にならない</p>
  </div>
</div>

<script>
  // しばらく操作がなければUIを退かせ、アートだけにする
  (function(){
    var timer, IDLE = 4000;
    function wake(){
      document.body.classList.remove('idle');
      clearTimeout(timer);
      timer = setTimeout(function(){ document.body.classList.add('idle'); }, IDLE);
    }
    ['pointermove','pointerdown','keydown','touchstart','wheel'].forEach(function(e){
      addEventListener(e, wake, {passive:true});
    });
    wake();
  })();
</script>
</body>
