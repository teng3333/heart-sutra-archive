<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listen — Open Gate Sutra</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="description" content="Listen to the world's Heart Sutra. Choose a gate — still or moving — and let it play.">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Open Gate Sutra">
<meta property="og:title" content="Listen — Open Gate Sutra">
<meta property="og:description" content="Choose a gate — still or moving — and let it play.">
<meta property="og:url" content="https://teng3333.github.io/heart-sutra-archive/listen.html">
<meta property="og:image" content="https://teng3333.github.io/heart-sutra-archive/assets/og-card.jpg">
<meta property="og:image:width" content="1200">

<meta name="twitter:image" content="https://teng3333.github.io/heart-sutra-archive/assets/og-card.jpg">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
<script src="src/js/consent.js" defer></script>
<!-- 落ちた記録と音の記録(調査用)。?diag=1 で画面下に一覧が出る。
     この画面こそ調べたい相手なのに読み込んでいなかった(2026-09-26) -->
<script src="src/js/diag.js?v=2"></script>
<!-- 聞き流しの画面。生きた背景アートを全画面で使い、音のエネルギーで呼吸させる -->
<script>window.OGS_ART_FULLSCREEN = true;</script>
<script src="src/js/living-bg.js?v=36" defer></script>
<style>
  :root{
    --ai:#131a26; --ai-deep:#0d1220; --washi:#d9c49a; --washi-hi:#e9dcba;
    --shu:#b23a2e; --ruri:#6fa8d6; --nibi:#8d826d;
    --hair:rgba(217,196,154,.18); --hair2:rgba(217,196,154,.34);
    --ja:"Shippori Mincho","Hiragino Mincho ProN",serif;
    --en:"Cormorant Garamond",Georgia,serif;
    --ui:ui-sans-serif,-apple-system,"Hiragino Sans",sans-serif;
    --c:var(--washi);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  /* 背景canvasは #04060b を地に、周辺減光で端を rgb(3,5,10) まで落とす。
     絵を中央へ寄せた分だけ右端に素の背景が覗くので、bodyをその色ちょうどに合わせる。
     近い色ではなく実測値に合わせているので、継ぎ目の線は出ない */
  body{margin:0;background:#03050a;color:var(--washi);font-family:var(--ui);
    -webkit-font-smoothing:antialiased;overflow:hidden}
  /* 音の強さはCSS変数で渡す。canvasを描き直さずに呼吸させられる */
  #living-bg{transform:translateX(var(--art-x,0)) scale(var(--breath,1));transform-origin:50% 50%;
    filter:brightness(var(--glow,1));will-change:transform,filter}
  /* living-bg.js は絵の中心を横 63% に置く。自動生成なので触らず、canvasごと左へ寄せて中央に合わせる */
  :root{--art-x:-13vw}
  @media (max-width:700px){ :root{--art-x:0} }
  @media (prefers-reduced-motion:reduce){ #living-bg{transform:translateX(var(--art-x,0));filter:none} }

  /* 音を表す波。背景の上、UIの下に重ねる */
  #waves{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;
    pointer-events:none;opacity:0;transition:opacity .6s ease}
  .stage.playing ~ #waves, body.playing #waves{opacity:1}
  /* 曲が変わるとき、絵をいったん闇へ還してから、次の曲の姿が現れる(2026-09-16 高尾さん指示)。
     早送りでは暗転させない(聴いている途中で切れるため)。
     透明度を下げる方式では暗転中も0.08ほど残り、球と波の輪郭が見えていたため、
     背景と波の上に黒い幕を重ねる方式にした(2026-09-17 高尾さん指摘) */
  #blackout{position:fixed;inset:0;z-index:0;background:#03050a;opacity:0;
    pointer-events:none;transition:opacity 1.35s ease}
  html.swap #blackout{opacity:1}
  /* 幕だけでは、幕が引いた瞬間に波が満開で現れ、その奥に球の影も見えていた
     (2026-09-17 高尾さん指摘)。波と最背面の背景も一緒に沈め、戻りは幕より遅くする。
     幕が引いたときには、まだ薄いところから立ち上がっている状態にする */
  #living-bg,#waves{transition:opacity 2.2s ease}
  html.swap #living-bg,html.swap #waves{opacity:0 !important;transition:opacity 1.1s ease}
  /* 背景canvas(living-bg)は z-index:0。UIはその上に乗せる */
  .stage{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}

  .bar{display:flex;align-items:center;gap:14px;padding:14px 20px;flex:none}
  /* 戻り口。くすませすぎると背景に溶けて気づけない(2026-09-19 高尾さん指摘)。
     字を少し大きく、色を明るくし、押せる面も広げる */
  .home{font-family:var(--en);font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--washi);text-decoration:none;padding:6px 10px 6px 0;
    opacity:.85;transition:opacity .2s}
  .home:hover,.home:focus-visible{opacity:1;color:var(--washi-hi)}
  .seal{font-family:var(--ja);font-size:15px;color:var(--washi-hi);letter-spacing:.3em}

  .center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
    padding:20px;text-align:center;min-height:0;overflow-y:auto}
  /* 曲が流れている間は絵が主役。文字は左の柱にまとめ、画面の中心を絵に明け渡す */
  .stage.playing .center{display:block;padding:0;text-align:left;overflow:visible}
  .stage.playing .np{position:fixed;left:22px;top:56px;z-index:2;
    max-width:min(28rem,46vw);text-align:left}
  .stage.playing .np .ctl{position:fixed;left:22px;bottom:22px;margin:0;
    justify-content:flex-start;transition:bottom .28s ease}
  .stage.playing.an-on .np .ctl{bottom:66px}
  /* 案内文は曲名と重なるので、操作列の真上へ逃がす */
  .stage.playing .state{position:fixed;left:22px;bottom:78px;margin:0;z-index:2;
    max-width:22rem;text-align:left;transition:bottom .28s ease}
  .stage.playing.an-on .state{bottom:122px}
  /* 左に寄せた文字が絵に埋もれないよう、左側だけ暗幕を垂らす */
  .stage.playing::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;
    background:linear-gradient(100deg,rgba(8,11,20,.92) 0%,rgba(8,11,20,.62) 24%,
                               rgba(8,11,20,.18) 42%,transparent 58%)}
  @media (max-width:700px){
    .art img{width:60px;height:60px}
    .lyr{max-height:34vh}
    .stage.playing .np{left:16px;right:16px;max-width:none;top:52px}
    /* 画面の下には解析の札(幅139・高さ24)が居座っている。
       操作列を bottom:16px に置くと2段目が札の下に潜り、Shareが押せなかった
       (2026-09-21 高尾さんの画面で発覚)。札の上へ逃がす。
       あわせて釦の横の余白を詰め、段数を増やさない(幅390で2段に収まる) */
    .stage.playing .np .ctl{left:16px;bottom:44px}
    .stage.playing .state{left:16px;right:16px;bottom:100px;max-width:none}
    .stage.playing.an-on .np .ctl{bottom:94px}
    .stage.playing.an-on .state{bottom:150px}
    .stage.playing::before{
      background:linear-gradient(to top,rgba(8,11,20,.9),rgba(8,11,20,.35) 34%,
                                rgba(8,11,20,.55) 72%,rgba(8,11,20,.85))}
  }

  /* 門 */
  .gates{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
  .gate{background:rgba(13,18,32,.55);border:1px solid var(--hair2);color:inherit;font:inherit;
    width:150px;padding:26px 12px;cursor:pointer;display:flex;flex-direction:column;gap:8px;
    align-items:center;backdrop-filter:blur(3px);transition:border-color .2s,background .2s}
  .gate[hidden]{display:none}   /* .gate の display:flex が hidden 属性に勝ってしまうため */
  .gate:hover,.gate:focus-visible{border-color:var(--washi);background:rgba(13,18,32,.75)}
  .gate:focus-visible{outline:2px solid var(--ruri);outline-offset:3px}
  .gate b{font-family:var(--ja);font-size:34px;font-weight:500;line-height:1;color:var(--washi-hi)}
  .gate .en{font-family:var(--en);font-size:13px;letter-spacing:.3em}
  .gate small{font-family:var(--en);font-size:9.5px;letter-spacing:.18em;color:var(--nibi);line-height:1.7}

  /* いま鳴っているもの */
  .np{display:none;max-width:34rem}
  .np.on{display:block}
  .np-shelf{font-family:var(--en);font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--c)}
  .np-title{font-family:var(--ja);font-size:clamp(20px,4.4vw,30px);color:var(--washi-hi);
    margin:12px 0 0;line-height:1.45;text-wrap:balance;
    /* 背景の絵は曲ごとに変わる。どんな絵の上でも読めるよう、文字の後ろだけ暗くする */
    text-shadow:0 1px 14px rgba(8,11,20,.95),0 0 4px rgba(8,11,20,.8)}
  .np-shelf,.np-by,.np-meta{text-shadow:0 1px 10px rgba(8,11,20,.9)}
  .np-title-link{color:inherit;text-decoration:none;border-bottom:1px solid transparent}
  .np-title-link:hover,.np-title-link:focus-visible{border-bottom-color:var(--hair2)}
  .np-tagline{font-family:var(--ja);font-size:clamp(13px,2.2vw,16px);color:var(--washi-hi);
    margin:8px 0 0;letter-spacing:.08em;line-height:1.6;opacity:.9;text-shadow:0 1px 10px rgba(8,11,20,.9)}
  .np-by{font-size:12.5px;color:var(--washi);margin-top:10px}
  .np-by a{color:var(--ruri);text-decoration:none;border-bottom:1px solid var(--hair2)}
  .np-meta{font-size:10.5px;color:var(--nibi);margin-top:6px;letter-spacing:.06em}

  .ctl{display:flex;gap:8px;justify-content:center;margin-top:22px;flex-wrap:wrap;align-items:center}
  .ctl button{background:rgba(13,18,32,.55);border:1px solid var(--hair2);color:var(--washi);
    font:inherit;font-size:11px;letter-spacing:.12em;padding:9px 16px;cursor:pointer;backdrop-filter:blur(3px)}
  .ctl button:hover{border-color:var(--washi)}
  .ctl button:focus-visible{outline:2px solid var(--ruri);outline-offset:2px}
  /* 行き先が無いときは鈍らせる。押せなくはしない(頭出しには使える) */
  .ctl button.dim{opacity:.42}
  /* ANの曲評。顔だけでは何が起きるか読み取れなかった(2026-09-21 高尾さん指摘)。
     顔は名乗りとして小さく残し、「曲評」と字で言う。他の釦と同じ高さに揃える */
  .an-btn{display:inline-flex;align-items:center;gap:7px;
    padding:7px 14px 7px 7px!important;border-radius:999px}
  .an-btn img{width:20px;height:20px;border-radius:50%;object-fit:cover;display:block;opacity:.85}
  .an-btn span{font-family:var(--ja);font-size:13px;letter-spacing:.04em}
  .an-btn[aria-pressed="true"]{border-color:var(--shu)!important}
  .an-btn[aria-pressed="true"] img{opacity:1}

  /* ジャケット。左の柱の頭に、小さく置く。絵の主役は生態系なので大きくしない */
  .art{display:block;padding:0;margin:0 0 14px;background:none;border:1px solid var(--hair2);
    line-height:0;cursor:pointer;transition:border-color .2s}
  .art:hover,.art:focus-visible{border-color:var(--washi)}
  .art:focus-visible{outline:2px solid var(--ruri);outline-offset:3px}
  .art img{width:76px;height:76px;object-fit:cover;display:block}

  /* ジャケットを大きく見る。押した人だけに開く */
  .art-full[hidden],.lyr[hidden],#btnLyr[hidden],.art[hidden]{display:none}
  .art-full{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;cursor:pointer;
    background:rgba(4,6,11,.93);backdrop-filter:blur(6px)}
  .art-full img{max-width:min(74vw,560px);max-height:72vh;object-fit:contain;
    border:1px solid var(--hair2)}
  .art-full-hint{font-family:var(--en);font-size:9.5px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--nibi);margin:0}

  /* 歌詞。押した時だけ左の柱に開く。聞き流しの邪魔をしない */
  .lyr{margin-top:18px;max-height:min(42vh,340px);overflow-y:auto;
    border-left:1px solid var(--hair2);padding:2px 0 2px 14px}
  .lyr-head{font-family:var(--en);font-size:9.5px;letter-spacing:.24em;
    text-transform:uppercase;color:var(--nibi);margin:0 0 8px}
  .lyr-body{font-family:var(--ja);font-size:13.5px;line-height:2.1;color:var(--washi);
    white-space:pre-wrap;text-shadow:0 1px 10px rgba(8,11,20,.9)}
  .ctl button[aria-pressed="true"]{border-color:var(--shu);color:var(--washi-hi)}
  #btnLyr{font-family:var(--ja);font-size:13px;letter-spacing:0;padding:7px 14px}
  /* 画像として持ち帰る釦。押している間だけ文言が変わる */
  #btnShot[disabled]{opacity:.55;cursor:default}

  .state{font-size:12.5px;color:var(--nibi);line-height:1.9;max-width:30rem}
  .state b{color:var(--washi)}
  /* つながらなかったときの「再試行」。操作釦と同じ作法にする */
  .state .retry{display:inline-block;margin-top:9px;background:rgba(13,18,32,.55);
    border:1px solid var(--hair2);color:var(--washi);font:inherit;font-size:11px;
    letter-spacing:.12em;padding:8px 15px;cursor:pointer;backdrop-filter:blur(3px)}
  .state .retry:hover{border-color:var(--washi)}
  .state .retry:focus-visible{outline:2px solid var(--ruri);outline-offset:2px}
  .state a{color:var(--washi-hi);text-decoration:none;border-bottom:1px solid var(--hair2)}
  .state a:hover{border-color:var(--washi)}

  /* 電子掲示板 */
  .ticker{flex:none;height:0;overflow:hidden;border-top:1px solid transparent;
    background:rgba(13,18,32,.9);transition:height .28s ease,border-color .28s ease}
  .ticker.on{height:46px;border-top-color:var(--shu)}
  .ticker.open{height:auto;max-height:44vh;overflow-y:auto}
  .tick-track{display:flex;align-items:center;height:46px;white-space:nowrap;cursor:pointer}
  .ticker.open .tick-track{height:auto;white-space:normal;padding:16px 20px;display:block}
  .tick-text{font-family:var(--ja);font-size:14.5px;color:#ffb9a6;letter-spacing:.04em;
    padding-left:100%;animation:flow 26s linear infinite;text-shadow:0 0 12px rgba(178,58,46,.55)}
  .ticker.open .tick-text{padding-left:0;animation:none;line-height:2;color:var(--washi-hi);text-shadow:none}
  .ticker.paused .tick-text{animation-play-state:paused}
  @keyframes flow{from{transform:translateX(0)}to{transform:translateX(-100%)}}
  .tick-hint{font-family:var(--en);font-size:9px;letter-spacing:.2em;color:var(--nibi);
    text-transform:uppercase;padding:0 0 10px}
  .ticker.open .tick-hint{display:block}
  .ticker:not(.open) .tick-hint{display:none}

  /* living-bg が自前で置く動き停止ボタン。この画面では操作列と重なるので上へ逃がす。
     living-bg.js は自動生成なので、あちらは触らず見た目だけ上書きする */
  #motion-toggle{top:11px!important;right:14px!important;left:auto!important;bottom:auto!important;
    transform:scale(.82);transform-origin:100% 0;opacity:.7}
  #motion-toggle:hover{opacity:1}
  @media (max-width:700px){
    #motion-toggle{top:10px!important;right:10px!important;bottom:auto!important}
    /* 釦の横の余白を詰め、段数を増やさない。
       この2行は .ctl button(基本)より後ろに置くこと。前に置くと負ける */
    .ctl button{padding:9px 10px}
    .an-btn{padding:7px 10px 7px 7px!important}
  }

  @media (prefers-reduced-motion:reduce){
    .tick-text{animation:none;padding-left:20px}
    .ticker.on{height:auto;max-height:40vh;overflow-y:auto}
    .tick-track{height:auto;white-space:normal;padding:14px 20px;display:block}
  }
</style>
</head>
<body>
<div class="stage">
  <div class="bar">
    <!-- 他のページと同じ「← Home」に揃える(2026-09-19 高尾さん指摘)。
         「← Open Gate Sutra」は題名に見え、戻れると読み取れなかった -->
    <a class="home" href="./">← Home</a>
    <span class="seal" aria-hidden="true">開羯諦経</span>
  </div>

  <div class="center">
    <div class="gates" id="gates">
      <button class="gate" type="button" data-axis="sei">
        <b aria-hidden="true">静</b><span class="en">STILL</span>
        <small>FOCUS<br>&amp; RELAX</small>
      </button>
      <button class="gate" type="button" data-axis="do">
        <b aria-hidden="true">動</b><span class="en">MOVE</span>
        <small>ENERGY<br>&amp; INSPIRE</small>
      </button>
      <!-- 終始静かな曲だけの門(2026-09-22 高尾さん指示)。
           「静」の棚にもビートの効いた曲が多く、瞑想には向かなかった。
           分析データでは「終始静か」かどうかが判定できない
           (曲中の起伏を表す development は、108曲中85曲が同じ75だった)ので、
           運営が耳で選んだ曲を MEI に並べる。_dev/mei_picker.html で選ぶ -->
      <button class="gate" type="button" data-axis="mei">
        <b aria-hidden="true">瞑</b><span class="en">STILLNESS</span>
        <small>MEDITATE<br>&amp; BREATHE</small>
      </button>
      <!-- 静も動も混ぜて流す門(2026-09-19 高尾さん指示) -->
      <button class="gate" type="button" data-axis="all">
        <b aria-hidden="true">全</b><span class="en">ALL</span>
        <small>EVERY<br>SHELF</small>
      </button>
      <!-- コンテストの応募作だけを流す門(2026-09-26 高尾さん指示)。
           漢字と文言は contests/<回>.json の gate から入れる。読めなければ出さない -->
      <button class="gate" type="button" data-axis="contest" hidden>
        <b aria-hidden="true" id="gateContestKanji"></b><span class="en" id="gateContestEn"></span>
        <small id="gateContestSub"></small>
      </button>
    </div>

    <div class="np" id="np">
      <button class="art" type="button" id="npArtBtn" hidden
              aria-label="ジャケットを大きく見る">
        <!-- crossorigin は背景の球と条件を揃えるため(2026-09-17)。同じジャケットを
             印なしで先に読むと、後から印つきで読む背景側がCORSで弾かれる(実測) -->
        <img id="npArt" alt="" width="76" height="76" crossorigin="anonymous">
      </button>
      <p class="np-shelf" id="npShelf"></p>
      <p class="np-title" id="npTitle"></p>
      <p class="np-tagline" id="npTagline" hidden></p>
      <p class="np-by" id="npBy"></p>
      <p class="np-meta" id="npMeta"></p>
      <div class="lyr" id="lyr" hidden>
        <p class="lyr-head" id="lyrHead">詞 ／ LYRICS</p>
        <div class="lyr-body" id="lyrBody"></div>
      </div>
      <div class="ctl">
        <button class="an-btn" type="button" id="anBtn" aria-pressed="false"
                aria-label="ANの曲評を読む">
          <img src="assets/an/face-human.webp" alt="" width="20" height="20">
          <span>曲評</span>
        </button>
        <button type="button" id="btnLyr" aria-pressed="false" hidden
                aria-label="歌詞を表示する">詞</button>
        <button type="button" id="btnPlay" aria-label="再生 / Play">Play</button>
        <button type="button" id="btnPrev" aria-label="前の曲へ">‹ Prev</button>
        <button type="button" id="btnNext" aria-label="次の曲へ">Next ›</button>
        <button type="button" id="btnGate">Gate</button>
        <!-- いま鳴っている世界を、そのまま正方形の画像にして持ち帰る(2026-09-18 高尾さん指示) -->
        <button type="button" id="btnShot" aria-label="この画面を画像として保存する">Save image</button>
        <button type="button" id="btnShare" aria-label="この画面の画像をSNSへ出す">Share</button>
      </div>
    </div>

    <p class="state" id="state" role="status" aria-live="polite">Choose a gate, and it plays.<br><span style="color:var(--washi)">門を選ぶと、流れ始めます。</span></p>
  </div>

  <div class="ticker" id="ticker" aria-live="polite">
    <div class="tick-track" id="tickTrack" role="button" tabindex="0"
         aria-label="タップで停止・全文表示">
      <span class="tick-text" id="tickText"></span>

(function () {

     端末名では見分けない(iPadはMacと名乗る)。指で触れる画面かどうかで分ける。
     触れる画面のノートPCは合成側に入るが、外す方向の間違いなので

  var envFast = 0, envSlow = 0;   // 速い呼吸と、曲全体の腰の重さ、二つの時間軸で見る

  var reduceMotion = window.matchMedia &&

  /* ── 音を波にする ──
     周波数を5つの帯に分け、1帯に1本の波を割り当てる。
     低い音ほど下に、ゆっくり、大きくうねる。高い音ほど上で、細かく、速い。
     揺れはばはその帯の強さそのもの。音が止まれば波も凪ぐ。 */
  /* MP3は16kHzより上をほぼ捨てるので、帯は下半分に寄せる。
     音の力は高い帯ほど弱いため、帯ごとに持ち上げ(gain)を掛けて釣り合わせる。

     5本は手前から奥へ並ぶ。低い音ほど手前で、大きく、太く、間隔も広い。
     手前ほど短い時間を映すので速く流れ、奥ほど長い時間を映すのでゆっくり流れる。
     手前は画面の外までせり出し、奥は狭まる。遠近はこれで出る。

     lo/hi:周波数の範囲(0〜1)  y:静止線の高さ(画面比)  sec:画面に映る秒数
     amp:振れの大きさ(画面比)  w:線の太さ  a:濃さ  gain:持ち上げ
     spread:横の広がり  haze:遠くのものほど滲ませる量 */
  var BANDS = [
    { lo:0.36, hi:0.60, y:0.470, sec:9.0, amp:0.040, cyc:4.4, w:3.2, a:0.34, gain:2.6, spread:0.58, haze:1.00 },
    { lo:0.20, hi:0.36, y:0.545, sec:7.6, amp:0.052, cyc:3.3, w:4.4, a:0.42, gain:2.0, spread:0.70, haze:0.80 },
    { lo:0.10, hi:0.20, y:0.640, sec:6.3, amp:0.070, cyc:2.4, w:6.0, a:0.50, gain:1.5, spread:0.84, haze:0.60 },
    { lo:0.04, hi:0.10, y:0.765, sec:5.1, amp:0.094, cyc:1.7, w:8.5, a:0.58, gain:1.15, spread:1.00, haze:0.42 },
    { lo:0.00, hi:0.04, y:0.930, sec:4.0, amp:0.124, cyc:1.2, w:12.0, a:0.66, gain:1.0, spread:1.20, haze:0.28 }
  ];
  /* cyc は画面に乗るいちばん長い波の数。遠い線ほど多く、つまり細かい。
     遠くの海面が細かく見えるのと同じ理屈で、これが遠近をいちばん強く出す。

     一本の線は、波長のちがう成分を6つ重ねて作る。
     波長の比を黄金比にしてあるので割り切れず、全体の形は二度と同じにならない。
     さらに深い水では長い波ほど速く進む(速さは波長の平方根に比例)。
     成分ごとに速さが違うので、重なり方が刻々とずれていき、形が絶えず変わり続ける。
     正弦を3つ足すだけだった前の作りでは、いちばん強い成分の周期がそのまま見えて、
     同じ形が何度も流れていた。 */
  var PHI = 1.6180339887;          // 黄金比。これより割り切れにくい比はない
  var NCOMP = 6;
  BANDS.forEach(function(d, bi){
    var lam0 = 1 / d.cyc;          // いちばん長い波の波長(帯の横幅に対する比)
    var v0 = 1 / d.sec;            // その波が横幅を渡りきる速さ(1秒あたり)

    d.comp = [];
    for (var k = 0; k < NCOMP; k++){
      var lam = lam0 / Math.pow(PHI, k);
      /* 短い波ほど小さくする。実際の海面では波長が半分になると高さは
         3分の1ほどまで落ちる。落とし方が甘いと棘のようにぎざぎざになる。
         長いうねりが主役になるほど、水面はなだらかに見える */
      var amp = Math.pow(0.50, k);
      sum += amp;
      d.comp.push({ lam: lam, amp: amp,
                    v: v0 * Math.sqrt(lam / lam0),      // 長い波ほど速い
                    ph: (bi * 7.13 + k * 2.39) % 6.2832 });
    }
    d.comp.forEach(function(c){ c.amp /= sum; });       // 合計を1に揃える
  });;
  var bandEnv = [0,0,0,0,0];
  /* 波の形の個性と、曲の中での移ろい(2026-09-16 高尾さん指示)。
     ampK: 上下の幅の倍率  lamK: 横の波長の倍率  breathe: 移ろいの速さ(曲あたりの往復回数)

     数秒で目まぐるしく変えると聞き流しの邪魔になるので、1〜2分かけて一往復させる。 */
  /* 波長(lamK)は曲の中では動かさない。毎フレーム変えると波の位相が飛び、
     滑らかな水面が途中で止まって見えた(2026-09-16 高尾さん指摘)。
     曲の中で動かすのは上下幅だけにし、目標へ毎フレーム2%ずつ近づける(煙が舞うような遅さ)。
     波長は曲ごとの個性として、曲の変わり目(暗転中)にだけ入れ替える。 */
  var waveShape = { ampK: 1, lamK: 1, ampT: 1, br: 0, u: -1, has: false };
  window.__ogsWave = waveShape;     // 調整用。見た目には関係しない

  /* 球の中心をジャケットにする曲のID(2026-09-17 高尾さん指示)。
     曲ページから1曲を指定して来たときだけ入り、次の曲へ移ったら null に戻す。
     null のあいだ、中心は今までどおりANのまま。 */
  var centerArtId = null;
  var EDGE_FADE = 0.12;   // 走査線の両端を透かす幅(全体に対する割合)

  /* ── 音の強さを記録し、水面の形は別に作る ──
     記録するのは「その帯がどれだけ鳴っていたか」だけ。
     左端が今で、右へいくほど過去になる。曲の起伏が水面の高まりとして右へ流れていく。
     水面の形そのものは、下の drawWaves が毎フレーム波の重ね合わせから作る。
     こうすると、記録した山がそのままの形で流れるのではなく、
     流れながら形が変わり続ける。実際の水面と同じ振る舞いになる。 */
  var SR = 60;                                  // 1秒あたりの記録数
  var BUF_LEN = 620;                            // いちばん長い帯(9秒)を入れる長さ
  var trace = BANDS.map(function(){ return new Float32Array(BUF_LEN); });
  var head = 0, filled = 0, sampleAcc = 0, clock = 0;
  var bandRaw = [0,0,0,0,0], soft = [0,0,0,0,0], rough = [0,0,0,0,0], bandAvg = [0,0,0,0,0];

  function pushSample(){
    head = (head + 1) % BUF_LEN;
    if (filled < BUF_LEN) filled++;
    clock += 1 / SR;
    for (var b = 0; b < BANDS.length; b++){
      var raw = bandRaw[b];
      /* 二段に均す。立ち上がりはゆっくり、引くのはもっとゆっくり。
         打点の角が取れて、丸い高まりだけが残る */
      rough[b] += (raw - rough[b]) * (raw > rough[b] ? 0.055 : 0.018);
      soft[b]  += (rough[b] - soft[b]) * 0.05;
      bandAvg[b] += (raw - bandAvg[b]) * 0.004;

      var lv = 0.35 + soft[b] * 1.05 + (soft[b] - bandAvg[b]) * 0.7;

  /* ══════════════════════════════════════════════════════════════
     波の見せ方 10種(2026-09-17 高尾さん指示)
     試作 _proto_wave_styles.html で決めたものを、そのまま移した。

     作りの要点: 波は「中心線 cx,cy と 点ごとの太さ cw を作る」前半と、
     「それを塗る」後半の二段構え。前半は音の記録・波の重ね合わせ・遠近を
     すべて含む重い部分で、後半は塗るだけ。ここで差し替わるのは後半だけなので、
     どの見せ方でも波の動き・音への反応・滑らかさは同一になる。
       cx,cy: 中心線の座標  cw: その点の太さ  cl: その点の高さ(0=谷 1=山)
     ══════════════════════════════════════════════════════════════ */

  /* 元素ごとの候補。重なっていてよい(2026-09-17 高尾さん指示)。
     五行DNAができたら、styleFor の中でここから選ぶだけで曲と繋がる。 */
  var WAVE_ELEMENTS = {
    wood:  ['grass', 'leaf'],
    fire:  ['flame', 'smoke'],
    earth: ['dot', 'grass'],
    metal: ['spark', 'glow', 'sdot', 'dot'],
    water: ['water', 'mist']
  };

  /* 一定の間隔で点を間引くときの歩幅。step は点と点の画面上の距離(px) */
  function strideFor(step, px){
    var s = Math.round(px / Math.max(0.0001, step));
    return s < 1 ? 1 : s;
  }

  /* 場所ごとに決まる散らばり(0〜1)。同じ場所なら毎フレーム同じ値を返すので、
     大きさがちらつかない。草・炎・星・葉の大きさをばらばらにするのに使う */
  function rnd1(i, seed){
    var v = Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453;
    return v - Math.floor(v);
  }

  /* 二次曲線上の点(0〜1の位置 t)。草を根元から先へ切り分けるのに使う */
  function qbez(a, b, c, t){
    var m = 1 - t;
    return m * m * a + 2 * m * t * b + t * t * c;
  }

  /* 中心線の傾き(その点での dy/dx)。草・葉・炎の向きに使う */
  function slopeAt(cx, cy, i, n){
    var lo = i > 0 ? i - 1 : 0, hi = i < n - 1 ? i + 1 : n - 1;
    var dx = cx[hi] - cx[lo];
    return dx === 0 ? 0 : (cy[hi] - cy[lo]) / dx;
  }

  /* ── 帯の輪郭をなぞる。水面・煙・霧が共通で使う ──
     mul: 太さの倍率  off: 中心線を縦にずらす量 */
  function bandPath(ctx, cx, cy, cw, n, mul, off){
    ctx.beginPath();
    ctx.moveTo(cx[0], cy[0] + off - cw[0] * 0.5 * mul);
    for (var k = 1; k < n; k++) ctx.lineTo(cx[k], cy[k] + off - cw[k] * 0.5 * mul);
    for (var m = n - 1; m >= 0; m--) ctx.lineTo(cx[m], cy[m] + off + cw[m] * 0.5 * mul);
    ctx.closePath();
  }

  /* 十字の星をひと筆で描き足す。四隅をくびれさせると、光条の尖った星になる。
     w はくびれの深さ。R に対して小さいほど、鋭い四芒星になる */
  function starPath(ctx, x, y, R, w){
    ctx.moveTo(x, y - R);
    ctx.quadraticCurveTo(x + w, y - w, x + R, y);
    ctx.quadraticCurveTo(x + w, y + w, x, y + R);
    ctx.quadraticCurveTo(x - w, y + w, x - R, y);
    ctx.quadraticCurveTo(x - w, y - w, x, y - R);
    ctx.closePath();
  }

  var PAINT = {};

  /* ── 水面 ── もとからあった塗り。帯を塗り、上端に光の稜線を乗せる */
  PAINT.water = function(g){
    var ctx = g.ctx, d = g.d, cx = g.cx, cy = g.cy, cw = g.cw, n = g.n;
    var col = g.col, lit = g.lit, step = g.step, x0 = g.x0, x1 = g.x1;
    bandPath(ctx, cx, cy, cw, n, 1, 0);
    /* 上が明るく下へ抜けていく塗り。水面に光が乗って、
       下へいくほど水に沈んでいくように見せる */
    var gr = ctx.createLinearGradient(0, g.baseY - g.amp, 0, g.baseY + g.amp * 0.9);
    gr.addColorStop(0,    'rgba(' + lit + ',' + (d.a * 0.8).toFixed(3) + ')');
    gr.addColorStop(0.32, 'rgba(' + col + ',' + d.a.toFixed(3) + ')');
    gr.addColorStop(1,    'rgba(' + col + ',' + (d.a * 0.18).toFixed(3) + ')');
    ctx.fillStyle = gr;
    ctx.shadowColor = 'rgba(' + col + ',.5)';     // 遠いものほど滲む。空気遠近法
    ctx.shadowBlur = (5 + d.w * 1.6) * (0.6 + d.haze * 1.4);
    ctx.fill();
    ctx.shadowBlur = 0;

    /* 線に沿った濃淡。同じ濃さで塗ると帯が均一で平坦に見える。
       斜面が急なところほど光を返すので、そこを明るくする。
       さらにゆっくり動く斑を重ねて、光が散らばる面を作る */
    var NS = 26;
    var gp = ctx.createLinearGradient(x0, 0, x1, 0);
    for (var p2 = 0; p2 <= NS; p2++){
      var idx = Math.round(p2 / NS * (n - 1));
      var lo2 = Math.max(0, idx - 2), hi2 = Math.min(n - 1, idx + 2);
      var slope = Math.abs(cy[hi2] - cy[lo2]) / (step * (hi2 - lo2) + 0.001);
      slope = slope > 1 ? 1 : slope;
      var uu = p2 / NS;
      var patch = 0.5 + 0.5 * Math.sin(uu * 14.6 + clock * 0.55 + g.b * 2.3);
      var edge2 = Math.min(uu, 1 - uu) / EDGE_FADE;
      var tp2 = edge2 >= 1 ? 1 : edge2 * edge2 * (3 - 2 * edge2);
      var al2 = d.a * (0.30 * slope + 0.34 * patch * patch) * tp2;
      gp.addColorStop(uu, 'rgba(' + lit + ',' + al2.toFixed(3) + ')');
    }
    ctx.fillStyle = gp;
    ctx.fill();

    /* 水面の稜線。細い明るい線を上端にだけ重ねると、光の筋になる */
    ctx.beginPath();
    ctx.moveTo(cx[0], cy[0] - cw[0] * 0.5);
    for (var q = 1; q < n; q++) ctx.lineTo(cx[q], cy[q] - cw[q] * 0.5);
    var gl = ctx.createLinearGradient(x0, 0, x1, 0);
    gl.addColorStop(0,    'rgba(' + lit + ',0)');
    gl.addColorStop(0.18, 'rgba(' + lit + ',' + (d.a * 0.62).toFixed(3) + ')');
    gl.addColorStop(0.82, 'rgba(' + lit + ',' + (d.a * 0.62).toFixed(3) + ')');
    gl.addColorStop(1,    'rgba(' + lit + ',0)');
    ctx.strokeStyle = gl;
    ctx.lineWidth = Math.max(0.6, d.w * 0.16);
    ctx.stroke();
  };

  /* ── 煙 ── 同じ帯を三枚、ゆっくりずらして薄く重ねる。
     ずれは時計でゆっくり動くので、三枚の隙間が呼吸して見える */
  PAINT.smoke = function(g){
    var ctx = g.ctx, d = g.d, col = g.col, lit = g.lit;
    ctx.shadowColor = 'rgba(' + col + ',.55)';
    for (var k = 0; k < 3; k++){
      var sway = Math.sin(clock * 0.26 + k * 2.1 + g.b * 1.7);
      var off = (k - 1) * d.w * 1.15 + sway * d.w * 0.75;
      var mul = 1.5 + k * 0.35 + sway * 0.18;
      bandPath(ctx, g.cx, g.cy, g.cw, g.n, mul, off);
      var gr = ctx.createLinearGradient(0, g.baseY - g.amp * 1.2, 0, g.baseY + g.amp);
      gr.addColorStop(0,   'rgba(' + lit + ',' + (d.a * 0.10).toFixed(3) + ')');
      gr.addColorStop(0.4, 'rgba(' + col + ',' + (d.a * 0.20).toFixed(3) + ')');
      gr.addColorStop(1,   'rgba(' + col + ',0)');
      ctx.fillStyle = gr;
      ctx.shadowBlur = (10 + d.w * 2.4) * (0.7 + d.haze * 1.2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  };

  /* ── 霧 ── 輪郭を描かず、太らせた帯を淡く置くだけ。
     煙との違いは「動かない・重ねない・もっと薄い」こと */
  PAINT.mist = function(g){
    var ctx = g.ctx, d = g.d, col = g.col, lit = g.lit;
    bandPath(ctx, g.cx, g.cy, g.cw, g.n, 3.1, 0);
    var gr = ctx.createLinearGradient(0, g.baseY - g.amp * 1.4, 0, g.baseY + g.amp * 1.2);
    gr.addColorStop(0,    'rgba(' + lit + ',0)');
    gr.addColorStop(0.42, 'rgba(' + lit + ',' + (d.a * 0.16).toFixed(3) + ')');
    gr.addColorStop(0.72, 'rgba(' + col + ',' + (d.a * 0.13).toFixed(3) + ')');
    gr.addColorStop(1,    'rgba(' + col + ',0)');
    ctx.fillStyle = gr;
    ctx.shadowColor = 'rgba(' + col + ',.45)';
    ctx.shadowBlur = (18 + d.w * 3.2) * (0.8 + d.haze * 1.4);
    ctx.fill();
    ctx.fill();          // 二度塗りで芯だけ少し濃くする
    ctx.shadowBlur = 0;
  };

  /* ── ドット ── 中心線に沿って等間隔に粒を打つ。
     一粒ずつ濃さを変えると遅いので、濃淡は二枚に分けて一度に塗る */
  PAINT.dot = function(g){
    var ctx = g.ctx, d = g.d, cx = g.cx, cy = g.cy, cw = g.cw, cl = g.cl, n = g.n;
    var st = strideFor(g.step, 7 + d.w * 0.7);
    var i, r;
    ctx.beginPath();                                   // 下地の粒(全部)
    for (i = 0; i < n; i += st){
      r = cw[i] * 0.46;
      if (r < 0.35) continue;
      ctx.moveTo(cx[i] + r, cy[i]);
      ctx.arc(cx[i], cy[i], r, 0, 6.2831853);
    }
    ctx.fillStyle = 'rgba(' + g.col + ',' + (d.a * 0.62).toFixed(3) + ')';
    ctx.shadowColor = 'rgba(' + g.col + ',.5)';
    ctx.shadowBlur = 3 + d.haze * 5;
    ctx.fill();
    ctx.beginPath();                                   // 山の近くだけ明るい芯
    for (i = 0; i < n; i += st){
      if (cl[i] < 0.55) continue;
      r = cw[i] * 0.22;
      if (r < 0.3) continue;
      ctx.moveTo(cx[i] + r, cy[i]);
      ctx.arc(cx[i], cy[i], r, 0, 6.2831853);
    }
    ctx.fillStyle = 'rgba(' + g.lit + ',' + (d.a * 0.85).toFixed(3) + ')';
    ctx.fill();
    ctx.shadowBlur = 0;
  };

  /* ── 角ドット ── 丸ドットと同じ並びを四角で打つ(2026-09-17 高尾さん指示)。
     座標と大きさを整数に丸めるのは、角をぼかさず立たせるため。
     滲みは一切掛けない(「四角のドットは周りをぼんやりしない。明確な四角」)。 */
  PAINT.sdot = function(g){
    var ctx = g.ctx, d = g.d, cx = g.cx, cy = g.cy, cw = g.cw, cl = g.cl, n = g.n;
    var st = strideFor(g.step, 7 + d.w * 0.7);
    var i, s;
    ctx.shadowBlur = 0;
    ctx.beginPath();                                   // 下地の粒(全部)
    for (i = 0; i < n; i += st){
      s = Math.round(cw[i] * 0.82);
      if (s < 1) continue;
      ctx.rect(Math.round(cx[i] - s * 0.5), Math.round(cy[i] - s * 0.5), s, s);
    }
    // 滲まない分うっすら見えるので、濃さを上げて存在を保つ
    ctx.fillStyle = 'rgba(' + g.col + ',' + (d.a * 0.88).toFixed(3) + ')';
    ctx.fill();
    ctx.beginPath();                                   // 山の近くだけ明るい芯
    for (i = 0; i < n; i += st){
      if (cl[i] < 0.55) continue;
      s = Math.round(cw[i] * 0.38);
      if (s < 1) continue;
      ctx.rect(Math.round(cx[i] - s * 0.5), Math.round(cy[i] - s * 0.5), s, s);
    }
    ctx.fillStyle = 'rgba(' + g.lit + ',' + (d.a * 1.0).toFixed(3) + ')';
    ctx.fill();
  };

  /* ── キラキラ・光点 ── 丸い光点だけ。星の版より控えめで、水面の煌めきに近い */
  PAINT.glow = function(g){
    var ctx = g.ctx, d = g.d, cx = g.cx, cy = g.cy, cw = g.cw, cl = g.cl, n = g.n;
    var st = strideFor(g.step, 11 + d.w * 0.5);
    var buckets = [[], [], []];
    for (var i = 0; i < n; i += st){
      if (cl[i] < 0.42) continue;
      // 点ごとに速さと位相をずらす。揃って光ると電飾に見える
      var tw = 0.5 + 0.5 * Math.sin(clock * (1.6 + (i % 7) * 0.33) + i * 1.97 + g.b * 2.2);
      var v = tw * tw * (cl[i] - 0.42) / 0.58;
      if (v < 0.12) continue;
      buckets[v > 0.66 ? 2 : v > 0.34 ? 1 : 0].push(i);
    }
    var ALPHA = [0.28, 0.6, 1.0];
    ctx.shadowColor = 'rgba(' + g.lit + ',.9)';
    for (var k = 0; k < 3; k++){
      var list = buckets[k];
      if (!list.length) continue;
      ctx.beginPath();
      for (var j = 0; j < list.length; j++){
        var p = list[j];
        var r = Math.max(0.5, cw[p] * 0.20 + 0.7 + k * 0.45);
        ctx.moveTo(cx[p] + r, cy[p]);
        ctx.arc(cx[p], cy[p], r, 0, 6.2831853);
      }
      ctx.fillStyle = 'rgba(' + g.lit + ',' + (d.a * ALPHA[k]).toFixed(3) + ')';
      ctx.shadowBlur = 3 + k * 5 + d.haze * 4;
      ctx.fill();
    }
    /* いちばん強い点には十字の光芒を足す。数が少ないので線でよい */
    var top = buckets[2];
    if (top.length){
      ctx.beginPath();
      for (var m = 0; m < top.length; m += 3){
        var q = top[m], L = 2.5 + cw[q] * 0.5;
        ctx.moveTo(cx[q] - L, cy[q]); ctx.lineTo(cx[q] + L, cy[q]);
        ctx.moveTo(cx[q], cy[q] - L); ctx.lineTo(cx[q], cy[q] + L);
      }
      ctx.strokeStyle = 'rgba(' + g.lit + ',' + (d.a * 0.5).toFixed(3) + ')';
      ctx.lineWidth = 0.7;
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
  };

  /* ── キラキラ・星 ── 山の近くに十字の星が咲く(2026-09-17 高尾さん指示)。
     明滅は点ごとに速さも位相もずらす。揃って光ると電飾に見えてしまう。
     濃さは三段に丸めて三回の塗りで済ませる(一点ずつ塗ると遅い) */
  PAINT.spark = function(g){
    var ctx = g.ctx, d = g.d, cx = g.cx, cy = g.cy, cw = g.cw, cl = g.cl, n = g.n;
    var st = strideFor(g.step, 15 + d.w * 0.7);
    var buckets = [[], [], []];
    var vals = {};
    for (var i = 0; i < n; i += st){
      if (cl[i] < 0.38) continue;
      var tw = 0.5 + 0.5 * Math.sin(clock * (1.6 + (i % 7) * 0.33) + i * 1.97 + g.b * 2.2);
      var v = tw * tw * (cl[i] - 0.38) / 0.62;
      if (v < 0.10) continue;
      vals[i] = v;
      buckets[v > 0.62 ? 2 : v > 0.30 ? 1 : 0].push(i);
    }
    var ALPHA = [0.34, 0.68, 1.0];
    ctx.shadowColor = 'rgba(' + g.lit + ',.95)';
    for (var k = 0; k < 3; k++){
      var list = buckets[k];
      if (!list.length) continue;
      ctx.beginPath();
      for (var j = 0; j < list.length; j++){
        var p = list[j];
        /* 大きな星と小さな星を混ぜる。8個に1個ほどが大きく咲き、残りは小さく煌めく。
           大きさは場所ごとに決まるので、同じ星が育ったり縮んだりしない */
        var sr = rnd1(p, g.b + 1.3);
        var sz = sr > 0.88 ? 0.6 + (sr - 0.88) * 2 : 0.45 + sr * 0.75;
        var R = (1.8 + cw[p] * 0.6) * (0.55 + vals[p] * 1.15) * sz;
        if (R < 1.0) continue;
        starPath(ctx, cx[p], cy[p], R, R * 0.13);
      }
      ctx.fillStyle = 'rgba(' + g.lit + ',' + (d.a * ALPHA[k]).toFixed(3) + ')';
      ctx.shadowBlur = 4 + k * 6 + d.haze * 5;
      ctx.fill();
    }
    /* 星の中心に白に近い芯を置く。光条だけだと輪郭が痩せて見える */
    var top = buckets[2];
    if (top.length){
      ctx.beginPath();
      for (var m = 0; m < top.length; m++){
        var q = top[m], r = Math.max(0.6, cw[q] * 0.16 + 0.6);
        ctx.moveTo(cx[q] + r, cy[q]);
        ctx.arc(cx[q], cy[q], r, 0, 6.2831853);
      }
      ctx.fillStyle = 'rgba(255,255,255,' + (d.a * 0.75).toFixed(3) + ')';
      ctx.shadowBlur = 8 + d.haze * 6;
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  };

  /* ── 草 ── 中心線から上へ細い葉を伸ばし、先を横へ靡かせる。
     根元は背景へ溶かす(2026-09-17 高尾さん指示)。葉を根元から先へ6つに切り、
     根元側の段ほど薄く塗る。一本ずつ濃淡を付けると1画面で数百回の塗りになるので、
     段ごとに一度だけ塗る。地際を結んでいた明るい線は、溶かす妨げになるので廃した。 */
  PAINT.grass = function(g){
    var ctx = g.ctx, d = g.d, cx = g.cx, cy = g.cy, cw = g.cw, cl = g.cl, n = g.n;
    var st = strideFor(g.step, 5 + d.w * 0.45);
    var SEG = 6;
    var FADE = [0.00, 0.30, 0.62, 0.84, 0.96, 1.00];   // 根元から先へ向かう濃さ
    for (var s = 0; s < SEG; s++){
      var t0 = s / SEG, t1 = (s + 1) / SEG;
      ctx.beginPath();
      for (var i = 0; i < n; i += st){
        /* 丈をばらばらにする。二乗して小さい側に寄せると、
           短い草が多く、ときどき背の高い草が混じる野原になる */
        var gr = rnd1(i, g.b);
        var L = (cw[i] * 1.9 + d.w * 1.1) * (0.30 + cl[i] * 0.70) * (0.45 + gr * gr * 2.1);
        if (L < 1.2) continue;
        var sl = slopeAt(cx, cy, i, n);
        // 傾きに直交する向き(上向き)。急な斜面では葉も傾く
        var inv = 1 / Math.sqrt(1 + sl * sl);
        var nx = sl * inv, ny = -inv;
        var wind = Math.sin(clock * 0.85 + cx[i] * 0.017 + g.b * 1.3) * 0.55
                 + Math.sin(clock * 0.31 + cx[i] * 0.006) * 0.3;
        var p0x = cx[i], p0y = cy[i];
        var p1x = cx[i] + nx * L * 0.55 + wind * L * 0.16, p1y = cy[i] + ny * L * 0.55;
        var p2x = cx[i] + nx * L + wind * L * 0.62,        p2y = cy[i] + ny * L;
        ctx.moveTo(qbez(p0x, p1x, p2x, t0), qbez(p0y, p1y, p2y, t0));
        ctx.lineTo(qbez(p0x, p1x, p2x, t1), qbez(p0y, p1y, p2y, t1));
      }
      // 先の段だけ光を帯びる。根元の段は色も薄く、滲みも掛けない
      ctx.strokeStyle = 'rgba(' + (s >= SEG - 2 ? g.lit : g.col) + ',' +
                        (d.a * 0.95 * FADE[s]).toFixed(3) + ')';
      ctx.lineWidth = Math.max(0.5, d.w * 0.16);
      ctx.shadowColor = 'rgba(' + g.col + ',.5)';
      ctx.shadowBlur = s === 0 ? 0 : 1 + s * 1.2 + d.haze * 3;
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
  };

  /* ── 葉 ── 中心線に沿って木の葉を並べる。
     最初はぼかした楕円だったが、小さいと丸に見えてドットと区別がつかなかった
     (2026-09-17 高尾さん指摘)。両端の尖った形にし、滲みを外し、一枚ずつ左右へ振った。 */
  PAINT.leaf = function(g){
    var ctx = g.ctx, d = g.d, cx = g.cx, cy = g.cy, cw = g.cw, n = g.n;
    var st = strideFor(g.step, 10 + d.w * 1.1);
    var i, rx, ry, ang, lr;
    ctx.shadowBlur = 0;

    ctx.beginPath();                                   // 葉身
    for (i = 0; i < n; i += st){
      rx = (cw[i] * 0.95 + d.w * 0.42) * (0.7 + rnd1(i, g.b + 5.1) * 0.8);
      if (rx < 1.0) continue;
      ry = rx * 0.38;
      // 波の傾きに、枝から振れる角度と、ゆっくりした裏返りを足す
      lr = (i / st) % 2 === 0 ? 1 : -1;
      ang = Math.atan(slopeAt(cx, cy, i, n)) + lr * 0.55
          + Math.sin(clock * 0.45 + i * 0.8 + g.b) * 0.18;
      ctx.save();
      ctx.translate(cx[i], cy[i]);
      ctx.rotate(ang);
      // 両端が尖る木の葉。上下を二本の弧で結ぶと、先の尖った形になる
      ctx.moveTo(-rx, 0);
      ctx.quadraticCurveTo(0, -ry, rx, 0);
      ctx.quadraticCurveTo(0,  ry, -rx, 0);
      ctx.closePath();
      ctx.restore();
    }
    ctx.fillStyle = 'rgba(' + g.col + ',' + (d.a * 0.82).toFixed(3) + ')';
    ctx.fill();

    ctx.beginPath();                                   // 葉脈。一本の細い線
    for (i = 0; i < n; i += st){
      rx = (cw[i] * 0.95 + d.w * 0.42) * (0.7 + rnd1(i, g.b + 5.1) * 0.8);
      if (rx < 1.0) continue;
      lr = (i / st) % 2 === 0 ? 1 : -1;
      ang = Math.atan(slopeAt(cx, cy, i, n)) + lr * 0.55
          + Math.sin(clock * 0.45 + i * 0.8 + g.b) * 0.18;
      ctx.save();
      ctx.translate(cx[i], cy[i]);
      ctx.rotate(ang);
      ctx.moveTo(-rx * 0.9, 0);
      ctx.lineTo(rx * 0.9, 0);
      ctx.restore();
    }
    ctx.strokeStyle = 'rgba(' + g.lit + ',' + (d.a * 0.7).toFixed(3) + ')';
    ctx.lineWidth = Math.max(0.4, d.w * 0.09);
    ctx.stroke();
  };

  /* ── 炎 ── 中心線から上へ舌を伸ばす。草との違いは
     「短くて太い・先が細る・速く揺れる・先が明るい」こと。
     一本ごとに縦のグラデーションを掛け、根元を背景へ溶かす。
     グラデーションは帯ごとに一度だけ、根元0・先端1の単位の空間で作り、
     舌ごとに座標をずらして使い回すので、作り直しは帯あたり1回で済む。
     枚を重ねる作りでは境目が横線として見えたため、この方式に改めた
     (2026-09-17 高尾さん指摘での作り直し)。 */
  PAINT.flame = function(g){
    var ctx = g.ctx, d = g.d, cx = g.cx, cy = g.cy, cw = g.cw, cl = g.cl, n = g.n;
    var st = strideFor(g.step, 6 + d.w * 0.8);

    var gr = ctx.createLinearGradient(0, 0, 0, -1);
    gr.addColorStop(0.00, 'rgba(' + g.col + ',0)');
    gr.addColorStop(0.14, 'rgba(' + g.col + ',' + (d.a * 0.10).toFixed(3) + ')');
    gr.addColorStop(0.38, 'rgba(' + g.col + ',' + (d.a * 0.34).toFixed(3) + ')');
    gr.addColorStop(0.64, 'rgba(' + g.col + ',' + (d.a * 0.62).toFixed(3) + ')');
    gr.addColorStop(0.85, 'rgba(' + g.lit + ',' + (d.a * 0.86).toFixed(3) + ')');
    gr.addColorStop(1.00, 'rgba(' + g.lit + ',' + (d.a * 1.00).toFixed(3) + ')');
    ctx.fillStyle = gr;
    ctx.shadowBlur = 0;

    for (var i = 0; i < n; i += st){
      /* 舌の大きさをばらばらにする。小さい舌が多く、ときどき大きく立ち上がる */
      var fr = rnd1(i, g.b + 3.7);
      var sz = 0.40 + fr * fr * 1.9;
      var half = (cw[i] * 0.55 + d.w * 0.12) * (0.60 + sz * 0.50);
      var L = (cw[i] * 2.2 + d.w * 1.4) * (0.35 + cl[i] * 0.95) * sz;
      if (L < 1.5) continue;
      // 速い揺らぎ。場所ごとに位相をずらすので、隣の舌と揃わない
      var fl = Math.sin(clock * 2.3 + i * 1.31 + g.b * 2.6) * 0.5
             + Math.sin(clock * 1.1 + i * 0.47) * 0.3;
      /* 根元をその舌の生え際へ移し、縦だけを丈の分だけ伸ばす。
         横は伸ばさないので、幅はそのまま画面上の太さで書ける */
      ctx.save();
      ctx.translate(cx[i], cy[i]);
      ctx.scale(1, L);
      ctx.beginPath();
      ctx.moveTo(-half, 0);
      ctx.quadraticCurveTo(-half * 0.9, -0.55, fl * L * 0.42, -1);
      ctx.quadraticCurveTo(half * 0.9, -0.55, half, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  };

  /* いま使う見せ方。曲の変わり目(暗転中)にだけ入れ替える。
     曲の途中で変えると、塗り方が切り替わった瞬間に波が飛んで見える */
  var waveStyle = 'water';

  function drawWaves(rgb){
    if (!wctx) return;
    sizeWaves();
    wctx.clearRect(0, 0, ww, wh);
    if (audio.paused) return;
    wctx.lineCap = 'round';
    wctx.lineJoin = 'round';
    var col = rgb[0] + ',' + rgb[1] + ',' + rgb[2];
    /* 光が当たった面の色。白そのものだと棚の色が消えてしまうので、
       棚の色を白へ半分ほど寄せた色を使う */
    var lit = Math.round(rgb[0] + (255 - rgb[0]) * 0.32) + ',' +
              Math.round(rgb[1] + (255 - rgb[1]) * 0.32) + ',' +
              Math.round(rgb[2] + (255 - rgb[2]) * 0.32);

    // 奥から手前へ描く。手前の水面が奥の水面を隠して、重なりの順が見える
    for (var b = 0; b < BANDS.length; b++){
      var d = BANDS[b];
      var n = Math.min(filled, Math.round(d.sec * SR));
      if (n < 8) continue;
      var baseY = wh * d.y, amp = wh * d.amp * waveShape.ampK;
      var half = ww * d.spread * 0.5;
      var x0 = ww * 0.5 - half, x1 = ww * 0.5 + half;
      var buf = trace[b], step = (x1 - x0) / (n - 1), comp = d.comp;

      /* 中心線と、その場所ごとの太さを先に出しておく。
         canvas は一本の線の途中で太さを変えられないので、
         上端と下端の二本を作って帯として塗る。
         cl はその点の高さ(0=谷 1=山)。粒・星・草・炎が大きさや明滅に使う */
      var cx = new Float64Array(n), cy = new Float64Array(n),
          cw = new Float64Array(n), cl = new Float64Array(n);
      for (var i = 0; i < n; i++){
        var u = i / (n - 1);
        // i=0 がいちばん新しい記録。左端が今で、右へいくほど過去
        var lv = buf[(head - i + BUF_LEN * 2) % BUF_LEN];

  var BIOMES = ['forest', 'flower', 'city', 'crystal', 'mech', 'leaf'];
