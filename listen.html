      var v = Math.min(1, acc / (z - a) / 255 * d.gain);
      bandRaw[b] = v;
      bandEnv[b] += (v - bandEnv[b]) * (0.09 + (BANDS.length - 1 - b) * 0.045);
    }

    /* 記録は時計に合わせて一定の間隔で行う。描画が遅れても線の速さが変わらない。
       まとめて追いつくのは4本まで。止まっていた間の穴埋めで暴れさせない */
    var tNow = performance.now() / 1000;
    sampleAcc += lastTick ? Math.min(0.2, tNow - lastTick) : 1 / SR;
    lastTick = tNow;
    for (var g2 = 0; g2 < 4 && sampleAcc >= 1 / SR; g2++){
      pushSample();
      sampleAcc -= 1 / SR;
    }
    if (sampleAcc > 4 / SR) sampleAcc = 0;

    /* 絵そのものを息づかせる。canvasには触れず、外から拡大と明るさだけ与える。
       振れ幅は控えめに。聞き流しの画面で揺れ続けると目が疲れる */
    if (!reduceMotion){
      var st = document.documentElement.style;
      st.setProperty('--breath', (1 + envFast * 0.055).toFixed(4));
      st.setProperty('--glow',   (0.88 + envFast * 0.42).toFixed(4));
      drawWaves(waveRGB);
    }
    var u = trackProgress();
    if (u >= 0) setAccent(u >= ACCENT_IN && u < ACCENT_OUT);

    var lb = window.__livingBG;
    if (!lb || u < 0) return;
    /* 画像として持ち帰る間だけ、段階を触らない(2026-09-18 高尾さん指示)。
       ここは毎フレーム段階を曲の進みへ寄せているので、外から飽和(完成した姿)に
       据えても、次のフレームで曲の位置へ引き戻されてしまう */
    if (shotFreeze) return;
    /* 大枠は曲の進み。音の強さは、そのまわりで少し前後させるだけにする。
       崩れ始めてからは音で引き戻さない(散っていく流れを乱さないため) */
    var sway = u < 0.85 ? (envSlow - 0.30) * 0.9 : 0;
    var target = Math.max(0, Math.min(14.4, phaseFor(u) + sway));
    try {
      var cur = lb.phase;
      /* 普段はゆっくり追う。早送りや巻き戻しで大きく飛んだときだけ速く追いつく
         (実測: 3%ずつだと85%へ飛ばしても数秒変化が見えず「変わらない」と感じる) */
      var gap = Math.abs(target - cur);
      lb.phase = cur + (target - cur) * (gap > 0.8 ? 0.14 : 0.03);
      /* 表情は毎回送る。背景の読み込みは後回しにされるので、
         曲を描き始めた時点ではまだ窓口が無いことがある。
         色は曲を通してゆっくり回す。どちらへ回るかは曲ごと。
         一度に動く量がごく小さいので、変わったことに気づかないまま変わる */
      /* 波の形を、曲の進みに合わせてゆっくり呼吸させる。
         色も同じ波に乗せて回すので、形が広がるときに色も移ろう */
      if (motion){
        var br = Math.sin(u * motion.waveBreath * 6.2831853);
        waveShape.ampT = motion.waveAmp * (1 + br * 0.26);          // 目標
        waveShape.ampK += (waveShape.ampT - waveShape.ampK) * 0.02;  // ゆっくり寄せる
        waveShape.br = br; waveShape.u = u; waveShape.has = true;
        /* 色も同じ呼吸に乗せるが、系統から外れない幅にとどめる */
        if (baseHex) waveRGB = rgbOf(shiftHue(baseHex, motion.hueDir * 12 * br));
        waveShape.rgb = waveRGB.join(',');   // 調整用。見た目には関係しない
      }
      if (motion && lb.setMotion){
        lb.setMotion({
          spin: motion.spin, tilt: motion.tilt, swellAmp: motion.swellAmp,
          swellRate: motion.swellRate, scale: motion.scale,
          hue: motion.hueFrom + motion.hueDir * HUE_SPAN * u
        });
      }
    } catch (e) {}
  }

  function render(t){
    current = t;
    /* 波長は曲ごとに決め、曲の中では動かさない(滑らかさを保つため) */
    var m0 = motionFor(t);
    waveShape.lamK = m0.waveLam;
    /* 波の見せ方も、ここ(暗転の最中)でだけ入れ替える。
       曲の途中で塗り方が変わると、その瞬間に波が飛んで見える */
    waveStyle = m0.waveStyle || 'water';
    waveShape.style = waveStyle;        // 調整用。見た目には関係しない
    /* 生態系を種に戻し、この曲の表情に入れ替える。
       前の曲の終わりの姿を引きずらせない */
    accentOn = false;
    motion = motionFor(t);
    try {
      if (window.__livingBG){
        window.__livingBG.setWeather('none');
        /* 前の曲の終わり(散って消えた状態)から続けて、散った粒が集まり始める */
        window.__livingBG.phase = 6.4;
        /* 球そのものを、この曲の地形で作り直す。暗転の最中に行うので、
           明けたときに前の曲の球が残っていることがない */
        if (window.__livingBG.setBiomeBias) window.__livingBG.setBiomeBias(biomeBiasFor(t));
        window.__livingBG.setMotion({
          spin: motion.spin, tilt: motion.tilt, swellAmp: motion.swellAmp,
          swellRate: motion.swellRate, scale: motion.scale, hue: motion.hueFrom
        });
        /* 止まった絵(スマホ)は自分では描き直さない。
           ここで頼まないと、曲を替えても前の曲の球が残る
           (2026-09-21 実測: 曲を替えても画布の濃さが一切変わらなかった)。
           動いている画面では何もしない。

           あわせて、一曲に一枚の姿を与える。色合いは曲の色から選び、
           相は 2.9〜4.3 の間で曲ごとにずらす(開花から飽和の幅)。
           この幅から出ると、種のように痩せるか、崩れて散ってしまう。 */
        if (window.__livingBG.still && window.__livingBG.setTheme){
          var hk = hashOf((t.title || '') + '~' + (t.id || ''));
          window.__livingBG.setTheme(themeForColor(trackColor(t)));
          window.__livingBG.restill(2.9 + (hk % 15) / 10);
        } else if (window.__livingBG.restill){
          window.__livingBG.restill();      // 動いている画面では何もしない
        }
      }
    } catch (e) {}
    var col = trackColor(t);
    baseHex = col;
    waveRGB = rgbOf(col);                                 // 波も同じ色で鳴る
    document.documentElement.style.setProperty('--c', col);

    /* ジャケット。無い曲のほうが多いので、あるときだけ出す。
       読み込めなかった場合も黙って引っ込める(壊れた枠を見せない) */
    if (t.artwork_url){
      artImg.src = t.artwork_url;
      artImg.alt = (t.title || '') + ' のジャケット';
      artBtn.hidden = false;
    } else {
      artBtn.hidden = true;
      artImg.removeAttribute('src');
    }
    artFull.hidden = true;

    /* 歌詞。添えられた曲だけボタンを出す。曲が変わったら閉じる。
       勝手に開くと、聞き流したい人の画面を文字で埋めてしまう */
    var hasLyrics = !!(t.lyrics && t.lyrics.trim());
    btnLyr.hidden = !hasLyrics;
    lyrBody.textContent = hasLyrics ? t.lyrics.trim() : '';
    document.getElementById('lyrHead').textContent =
      t.lyrics_lang ? '詞 ／ ' + t.lyrics_lang : '詞 ／ LYRICS';
    showLyrics(false);

    var shelf = [t.axis_label_ja, t.mode_label_ja, t.mode_label_en].filter(Boolean).join(' · ');
    if (t.also_on) shelf += '  ＋' + t.also_on.mode_label_ja;
    if (curAxis === 'contest' && contestCfg && contestCfg.gate && contestCfg.gate.shelf){
      shelf = contestCfg.gate.shelf;
    }
    document.getElementById('npShelf').textContent = shelf;
    var titleEl = document.getElementById('npTitle');
    titleEl.textContent = '';
    if (!DEMO && t.id){
      var tl = document.createElement('a');
      tl.className = 'np-title-link';
      tl.href = 't/' + t.id + '.html';
      tl.textContent = t.title || '';
      titleEl.appendChild(tl);
    } else {
      titleEl.textContent = t.title || '';
    }

    var npTg = document.getElementById('npTagline');
    npTg.textContent = t.tagline || '';
    npTg.hidden = !t.tagline;

    var by = document.getElementById('npBy');
    by.textContent = 'by ' + (t.artist_name || 'unknown') + ' ';
    var href = t.artist_link || t.source_url;
    if (href){
      var a = document.createElement('a');
      /* 同じタブで開くと再生が止まる。作者への動線が「聞くのをやめる」に化ける */
      a.href = href; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = '↗'; a.setAttribute('aria-label', '作者のページを新しいタブで開く');
      by.appendChild(a);
    }
    document.getElementById('npMeta').textContent =
      [t.genre, (t.languages || []).join(' / ')].filter(Boolean).join('  ·  ');

    /* 空に浮かぶものを曲ごとに変える(2026-09-16 高尾さん指摘)。
       素材は銀河・地球・月・太陽・土星の5つ。以前は「静なら月・動なら太陽」の2択で、
       同じ門の中では何曲流れても空が変わらなかった。
       静かな棚は月・地球・銀河、動く棚は太陽・土星・銀河を軸にし、
       どれになるかは曲名から決める(同じ曲なら毎回同じ空) */
    try {
      if (window.__livingBG && window.__livingBG.setCelestial){
        var sky = t.axis === 'sei' ? ['moon', 'earth', 'galaxy'] : ['sun', 'saturn', 'galaxy'];
        window.__livingBG.setCelestial(sky[hashOf((t.title || '') + '@' + (t.id || '')) % sky.length]);
      }
    } catch (e) {}

    /* 球の中心に宿る絵(2026-09-17 高尾さん指示)。
       曲ページから指定して来た、その曲のあいだだけジャケットを中心に置く。
       次の曲へ進んだ後と、棚から入った聞き流しは今までどおりAN。
       ジャケットの無い曲を指定された場合も、黙ってANのままにする。 */
    try {
      if (window.__livingBG && window.__livingBG.setCenterImage){
        var mine = (centerArtId !== null && t.id === centerArtId && !!t.artwork_url);
        /* コンテストの門では、どの曲も中心をジャケットにする(2026-09-26 高尾さん指示)。
           ジャケットの無い曲だけANのまま */
        var contestArt = (curAxis === 'contest' && !!t.artwork_url);
        window.__livingBG.setCenterImage((mine || contestArt) ? t.artwork_url : null);
        if (!mine) centerArtId = null;   // 一度離れたら、巡って戻っても出さない
      }
    } catch (e) {}

    /* ロック画面・イヤホン操作に曲名と作者名を出す。
       画面を見ない使い方なので、これが無いと体験が成立しない */
    if ('mediaSession' in navigator){
      navigator.mediaSession.metadata = new MediaMetadata({
        title: t.title || '', artist: t.artist_name || '', album: 'Open Gate Sutra',
        /* ロック画面にジャケットを出す。画面を見ない使い方でも、
           いま何が鳴っているかが一目で分かる */
        artwork: t.artwork_url
          ? [{ src: t.artwork_url, sizes: '512x512', type: 'image/jpeg' }]
          : []
      });
      navigator.mediaSession.setActionHandler('play',  function(){ audio.play(); });
      navigator.mediaSession.setActionHandler('pause', function(){ audio.pause(); });
      navigator.mediaSession.setActionHandler('nexttrack', next);
      // イヤホンのボタンや通知領域からも送れるようにする
      navigator.mediaSession.setActionHandler('previoustrack', prev);
    }

    tickText.textContent = t.an_comment
      ? t.an_comment + (t.tagline ? '　この曲は、' + t.tagline + '。' : '')
      : (t.good_points || '');
    if (ticker.classList.contains('on')) restartFlow();
  }

  function restartFlow(){
    tickText.style.animation = 'none';
    void tickText.offsetWidth;          // 再流し
    tickText.style.animation = '';
  }

  function preloadNext(){
    var n = queue[(pos + 1) % queue.length];
    if (n && n.audio_url) pre.src = n.audio_url;
  }

  /* 曲が変わる合図。絵を闇へ沈め、暗いうちに姿と色を入れ替えて、また現れさせる */
  var swapTimer = 0, swapEndTimer = 0;
  function swapDark(after){
    var root = document.documentElement;
    root.classList.add('swap');
    /* 前の暗転が残したタイマーも止める。止めないと、新しい暗転が途中で明るく戻る
       (実測: 1.8秒のはずが1.05秒で戻っていた。2026-09-16) */
    clearTimeout(swapTimer); clearTimeout(swapEndTimer);
    swapTimer = setTimeout(function(){
      try { after(); } finally {
        swapEndTimer = setTimeout(function(){ root.classList.remove('swap'); }, 400);
      }
    }, 1400);
  }

  /* 自動再生を拒まれたとき、次にどこかを触ったら鳴らす。
     釦を狙って押させるのは、聴きに来た人に課す仕事としては重い。
     一度鳴ればもう要らないので、その場で自分を外す(2026-09-21) */
  var armed = false;
  function armAnyTap(){
    if (armed) return;
    armed = true;
    var go = function(e){
      armed = false;
      document.removeEventListener('pointerdown', go, true);
      document.removeEventListener('keydown', go, true);
      /* 釦の上で起きた触りは、その釦に任せる。
         ここは画面全体を捕まえる番人なので、何もしないと Play/Pause や
         次へ/前へ の上でも先に鳴らしてしまう。押した釦と押し合いになり、
         止めたいのに鳴り出す(2026-09-25 高尾さん報告: pauseを押すと
         はじめの音がループする)。触りの行き先が釦なら、ここは退く */
      var t = e && e.target;
      if (t && t.closest && t.closest('button, a, .gate')) return;
      wakeAudioFromTap();
      audio.play().then(function(){ say(''); }, function(){});
    };
    document.addEventListener('pointerdown', go, true);
    document.addEventListener('keydown', go, true);
  }

  function go(i){
    swapDark(function(){ render(queue[i]); });
    /* 解錠を待ってから差し込む。待たないと解錠を自分で壊してしまう */
    var url = queue[i].audio_url;
    unlockReady.then(function(){
      setWaveSeed(queue[i]);   // 曲ごとに波の性格を変える
      /* 解析するPCだけ CORS で読む。携帯は解析しないので付けない。
         付けたままだと配信元のCORS許可が欠けたときに再生自体が失敗する。
         src より先に決めること(後から変えても効かない) */
      if (!TOUCH && !corsOff && audio.crossOrigin !== 'anonymous') audio.crossOrigin = 'anonymous';
      audio.src = url;
      return audio.play();
    }).then(function(){ noteAudio({ play: 'ok' }); }, function(e){
      /* 自動再生が拒まれた。札を Play へ戻さないと、押す前から止める釦に見える */
      noteAudio({ play: 'ng ' + (e && e.name), unlocked: unlocked });
      syncPlayBtn();
      say('Tap anywhere to play.<br>画面のどこかを触ると鳴ります。');
      armAnyTap();
    });
    preloadNext();
    updateNav();
    stampURL(queue[i].id);
  }

  function next(){
    if (!queue.length) return;
    pos += 1;
    if (pos >= queue.length){
      /* 一周したら並べ替える。ただし戻れる履歴は保つ。
         並べ替えた瞬間に「前へ」が別の曲を指すと、聴き手の記憶と食い違う */
      queue = shuffle(queue); pos = 0;
    }
    go(pos);
  }

  /* 前へ戻る。曲の途中なら、まず頭出しにする。
     音楽を聴く道具はどれもこう振る舞うので、説明が要らない */
  var HEAD_SEC = 3;
  function prev(){
    if (!queue.length) return;
    if (audio.currentTime > HEAD_SEC && !audio.paused){
      audio.currentTime = 0;
      return;
    }
    if (pos <= 0){                 // 先頭なら、その曲の頭へ戻すだけ
      audio.currentTime = 0;
      return;
    }
    pos -= 1;
    go(pos);
  }

  /* 先頭にいるときだけ「前へ」を鈍らせる。押せるが、行き先が無いことを示す */
  /* 住所に、いま聴いているものを映しておく(2026-09-22 高尾さん指摘)。
     これが無いと、聞き流し中に住所をコピーして人に渡しても、
     受け取った人には門しか出ない。「ページには行くが曲が始まらない」の原因。
     replaceState なので、戻る釦の履歴は汚さない。 */
  function stampURL(id){
    if (!history.replaceState) return;
    var q = [];
    if (curAxis) q.push('gate=' + curAxis);
    if (id) q.push('track=' + id);
    try {
      history.replaceState(null, '', location.pathname + (q.length ? '?' + q.join('&') : ''));
    } catch (e) {}
  }

  function updateNav(){
    var b = document.getElementById('btnPrev');
    if (b) b.classList.toggle('dim', pos <= 0);
  }

  /* 開発用: ?demo=1 で手元の音源を使う。
     同一オリジンなのでCORSの制約を受けず、音の解析と絵の連動をすぐ確かめられる。
     本番は常にAPIから引く(この分岐に入らない)。 */
  var DEMO = (new URLSearchParams(location.search)).get('demo') === '1';

  /* ── 瞑の棚 ────────────────────────────────────────────
     終始静かで、瞑想に向く曲の番号。運営が耳で選んだもの。
     増やすときは、この配列に番号を足すだけでよい(他は何も触らない)。
     選ぶ道具は _dev/mei_picker.html(手元用・公開していない)。
     頭・中・終の3か所を聴き比べられるようにしてある。
     分析データに頼らないのは、曲中の起伏を表す development が
     108曲中85曲で同じ値(75)になっていて、使い物にならないため。 */
  var MEI = [18, 53, 54, 139, 147, 162];   // 2026-09-22 高尾さんが耳で選んだ6曲

  /* ── コンテストの門 ──────────────────────────────────────
     いまの回。次の回は、ここを contests/ の新しいファイル名に書き換えるだけ。
     応募作の数え方はコンテスト頁の展示室(src/js/contest-live.js の entriesOf)と同じにする:
     曲番号が first_id 以上で、close_at までに投稿された、公開中の曲。
     この画面の台本は本文の途中で動き出すため、あちらを読み込んで使うことはできない */
  var CONTEST = '2026-09';
  var contestCfg = null;
  function loadContest(){
    return fetch('contests/' + CONTEST + '.json')
      .then(function(r){ if (!r.ok) throw 0; return r.json(); })
      .then(function(c){ contestCfg = c; return c; });
  }
  function contestEntries(items, c){
    var first = Number(c.first_id), close = Date.parse(c.close_at), skip = {};
    (c.exclude_ids || []).forEach(function(id){ skip[id] = 1; });
    return items.filter(function(t){
      if (!t || skip[t.id]) return false;
      var at = Date.parse(t.submitted_at);
      return Number(t.id) >= first && !isNaN(at) && at <= close;
    });
  }

  function fetchTracks(axis){
    if (DEMO){
      // 開発中は書き換えるたびに読み直したいので、毎回ちがう印をつける
      return fetch('src/js/demo-tracks.json?t=' + Date.now())
        .then(function(r){ return r.json(); })
        .then(function(list){
          return { items: list.filter(function(t){ return t.axis === axis; }) };
        });
    }
    var ctrl = new AbortController();
    var timer = setTimeout(function(){ ctrl.abort(); }, TIMEOUT);

    /* 「混ぜて聴く」。静も動も分けずに全曲を流す(2026-09-19 高尾さん指示)。
       棚のAPIは片側しか返さないので、全曲を返すアーカイブのAPIを使う */
    if (axis === 'contest'){
      return Promise.all([
        contestCfg ? Promise.resolve(contestCfg) : loadContest(),
        fetch(API.replace('/api/shelf/', '/api/archive'), { signal: ctrl.signal })
          .then(function(r){ clearTimeout(timer); if (!r.ok) throw 0; return r.json(); })
      ]).then(function(v){
        return { items: contestEntries(v[1].items || [], v[0]) };
      });
    }
    if (axis === 'all' || axis === 'mei'){
      return fetch(API.replace('/api/shelf/', '/api/archive'), { signal: ctrl.signal })
        .then(function(r){ clearTimeout(timer); if (!r.ok) throw 0; return r.json(); })
        .then(function(d){
          if (axis !== 'mei') return d;
          /* 選ばれた番号だけを、選ばれた順ではなく一覧の順で拾う。
             棚に無い番号(取り下げられた曲)は黙って落ちる */
          var want = {};
          MEI.forEach(function(id){ want[id] = 1; });
          return { items: (d.items || []).filter(function(t){ return want[t.id]; }) };
        });
    }

    return fetch(API + axis, { signal: ctrl.signal })
      .then(function(r){ clearTimeout(timer); if (!r.ok) throw 0; return r.json(); })
      .then(function(d){
        /* 主たる棚の曲だけを流す(2026-09-19 高尾さん指示)。
           棚のAPIは副次の棚でも曲を拾うため、静と動の両方に出る曲が11曲あり、
           動を聴いていたのに静の曲が来る、という混ざりが起きていた。
           t.axis はその曲の主たる棚を指すので、これで純粋な流れになる */
        var items = (d.items || []).filter(function(t){ return t.axis === axis; });
        return { axis: d.axis, count: items.length, items: items };
      });
  }

  function start(axis){
    curAxis = axis;
    say('Loading…');
    fetchTracks(axis)
      .then(function(d){
        var items = (d.items || []).filter(function(t){ return t.audio_url; });
        if (!items.length){
          say('<b>This shelf is not playing yet.</b><br>' +
              'この棚はまだ鳴りません。音源の公開準備が整うまで、もう少しお待ちください。');
          return;
        }
        queue = shuffle(items); pos = -1;
        gates.style.display = 'none';
        np.classList.add('on');
        document.querySelector('.stage').classList.add('playing');
        say('');
        next();     // 門を押した操作が起点なので、自動再生の制限に触れない
      })
      .catch(function(){
        sayRetry('<b>Could not reach the hall.</b><br>つながりませんでした。',
                 function(){ start(axis); });
      });
  }

  /* ── 門を押したその場で、音を解錠する ──────────────────────────
     スマホは「操作の直後」でないと音を出させない。
     門を押してから棚を取り終えるまで3〜6秒かかるので、取得を待ってから
     play() を呼ぶ頃には、その操作の効力が切れている。だから押しても鳴らず、
     「再生ボタンを押してください」まで行っていた(2026-09-21 高尾さん報告)。

     押されたその瞬間に、無音を一度だけ鳴らして止める。
     以後この audio は自由に鳴らせるようになる。本当の曲は go() が差し込む。
     無音は0.02秒のWAVを文字として持つ。読みに行かないので待たない。 */
  var SILENCE = 'data:audio/wav;base64,UklGRsQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YaAAAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA';
  var unlocked = false, unlocking = false;

  /* 解錠の結果は端末に残す。手元では再現できないため(2026-09-21)。
     住所の末尾に #diag を付けて開くと、背景の記録と一緒に読める */
  function noteAudio(v){
    try {
      var o = {};
      try { o = JSON.parse(localStorage.getItem('ogs-audio') || '{}'); } catch (e) {}
      for (var k in v) o[k] = v[k];
      o.t = new Date().toISOString().slice(11, 19);
      localStorage.setItem('ogs-audio', JSON.stringify(o));
    } catch (e) {}
  }

  /* 解錠が済むまで待てる約束。
     棚の取得が速いと、無音が鳴り終わる前に本当の曲が差し込まれ、
     解錠そのものが AbortError で中断していた(2026-09-21 実測)。
     パソコンは寛容なので鳴るが、スマホはここで閉じたままになる。
     長くても0.5秒で諦めて先へ進む(待ち続けて無音になるほうが悪い) */
  var unlockReady = Promise.resolve();

  function unlockAudio(){
    wakeAudioFromTap();
    if (unlocked) return;
    unlocked = true; unlocking = true;
    var settle;
    unlockReady = new Promise(function(res){ settle = res; });
    setTimeout(function(){ settle(); }, 500);
    var release = function(){ unlocking = false; settle(); };
    /* 無音を止めるのは、まだ無音が載っているときだけ。
       棚の取得が速いと、止める処理が届く前に本当の曲が載っていることがあり、
       そのまま止めると「押さないと鳴らない」状態になる。
       手元では無音の解錠(14.57秒)と本当の曲(17.66秒)の間が3秒あったが、
       記憶から返る端末では詰まりうる */
    var stopIfStillSilent = function(){
      if ((audio.src || '').indexOf('data:audio/wav') === 0) audio.pause();
      release();
    };
    try {
      audio.src = SILENCE;
      var pr = audio.play();
      if (pr && pr.then) pr.then(function(){ noteAudio({ unlock: 'ok' }); stopIfStillSilent(); },
                                 function(e){ noteAudio({ unlock: 'ng ' + (e && e.name) }); release(); });
      else { noteAudio({ unlock: 'old' }); stopIfStillSilent(); }
    } catch (e) { noteAudio({ unlock: 'throw' }); release(); }
  }

  [].forEach.call(gates.querySelectorAll('.gate'), function(g){
    g.addEventListener('click', function(){ unlockAudio(); wakeAudioFromTap(); start(g.dataset.axis); });
  });

  /* コンテストの門は、回の設定が読めたときだけ出す。
     文字は textContent でだけ入れる(設定ファイルの中身を HTML として扱わない) */
  (function(){
    var g = gates.querySelector('.gate[data-axis="contest"]');
    if (!g) return;
    loadContest().then(function(c){
      var gt = c.gate || {};
      if (!gt.kanji) return;
      document.getElementById('gateContestKanji').textContent = gt.kanji;
      document.getElementById('gateContestEn').textContent = gt.en || 'CONTEST';
      var sub = document.getElementById('gateContestSub');
      (gt.sub || []).forEach(function(line, i){
        if (i) sub.appendChild(document.createElement('br'));
        sub.appendChild(document.createTextNode(line));
      });
      g.hidden = false;
    }).catch(function(){ g.remove(); });
  })();

  /* 瞑の曲がまだ1曲も選ばれていないなら、門そのものを出さない。
     押しても空の棚が出るだけの門は、置かないほうがよい */
  (function(){
    if (MEI.length) return;
    var g = gates.querySelector('.gate[data-axis="mei"]');
    if (g) g.remove();
  })();

  function showLyrics(on){
    lyr.hidden = !on;
    btnLyr.setAttribute('aria-pressed', String(!!on));
    btnLyr.setAttribute('aria-label', on ? '歌詞を隠す' : '歌詞を表示する');
  }
  btnLyr.addEventListener('click', function(){ showLyrics(lyr.hidden); });

  /* ══════════════════════════════════════════════════════════════
     いま鳴っている世界を、正方形の画像にして持ち帰る(2026-09-18 高尾さん指示)
     別の絵を作るのではなく、画面に出ている二枚の canvas をそのまま重ねる。
     見ている世界と、持ち帰る画像が食い違わないようにするため。

     取り出せるのは、ジャケットに crossorigin を付けてあるから(2026-09-17)。
     付いていない画像を一枚でも描くと canvas が汚れ、書き出せなくなる。
     ══════════════════════════════════════════════════════════════ */
  var SHOT = 1080;                     // 書き出す一辺(SNSで縮まない大きさ)

  /* 画面のどこを正方形に切り取るか。
     living-bg は絵の中心を横63%・縦50%(細い画面では横50%・縦44%)に置く。
     そこを正方形の真ん中に据えるので、画面では右寄りの球が中央に収まる。
     波は同じ座標系の別の一枚なので、まったく同じ所を切れば重なりが保たれる。

     切り取りは画面より広く取る(2026-09-18 高尾さん指示)。
     五線の波は画面の高さ47〜93%にあるので、球のまわりだけを狭く切ると
     波が枠の外へ出てしまい、OGSらしさが画像から消える。
     画面の外まで切ると、その分は何も描かれていないので地の色が出る。
     もともと闇の絵なので継ぎ目は見えず、球のまわりに余白が生まれる。

     切り取りの中心は、球の中心より少し下に置く。こうすると球が画の上寄りに、
     波が下半分に収まり、いちばん下の帯に文字を置いても球に掛からない。 */
  function shotCrop(cv){
    var mobile = window.innerWidth < 760;
    var w = cv.width, h = cv.height;
    var cx = w * (mobile ? 0.50 : 0.63);
    var cy = h * (mobile ? 0.50 : 0.56);
    var half = Math.min(w, h) * 0.56;              // 画面より一回り広く
    return { x: cx - half, y: cy - half, s: half * 2 };
  }

  /* 一行に収まるよう字を詰める。収まらなければ末尾を…にする */
  function fitText(c, text, px, maxW, min){
    var size = px;
    while (size > min){
      c.font = size + 'px ' + FONT_JA;
      if (c.measureText(text).width <= maxW) return size;
      size -= 1;
    }
    c.font = min + 'px ' + FONT_JA;
    while (text.length > 4 && c.measureText(text + '…').width > maxW) {
      text = text.slice(0, -1);
    }
    return min;
  }
  var FONT_JA = '"Shippori Mincho","Hiragino Mincho ProN",serif';
  var FONT_EN = '"Cormorant Garamond",Georgia,serif';

  function buildShot(){
    var out = document.createElement('canvas');
    out.width = out.height = SHOT;
    var c = out.getContext('2d');
    var t = current || {};

    // ① 地の色。画面の body と同じ
    c.fillStyle = '#04060b';
    c.fillRect(0, 0, SHOT, SHOT);

    // ② 背景の絵。画面と同じ濃さ(0.80)で重ねる
    var bg = document.getElementById('living-bg');
    if (bg && bg.width){
      var r = shotCrop(bg);
      c.save();
      c.globalAlpha = 0.80;
      c.drawImage(bg, r.x, r.y, r.s, r.s, 0, 0, SHOT, SHOT);
      c.restore();
    }

    // ③ 波。背景と同じ所を切るので、重なりが画面のまま保たれる
    var wv = document.getElementById('waves');
    if (wv && wv.width){
      var r2 = shotCrop(wv);
      c.drawImage(wv, r2.x, r2.y, r2.s, r2.s, 0, 0, SHOT, SHOT);
    }

    /* ④ 周辺減光。四隅をわずかに落として目を中央へ集める。
       前は四隅を82%まで落としていて、波まで沈んでいた(2026-09-18 実測)。
       絵を殺さない程度に留める */
    var vg = c.createRadialGradient(SHOT / 2, SHOT / 2, SHOT * 0.34,
                                    SHOT / 2, SHOT / 2, SHOT * 0.80);
    vg.addColorStop(0, 'rgba(3,5,10,0)');
    vg.addColorStop(1, 'rgba(3,5,10,.46)');
    c.fillStyle = vg;
    c.fillRect(0, 0, SHOT, SHOT);

    /* ⑤ 幻獣。当たった回だけ重なる。
       周辺減光のあとに置く。先に置くと、輪がちょうど四隅にかかるので沈む。
       字の下地より前に置くので、輪の下側は字の帯に隠れる。透かしなので良い */
    if (shotBeast && shotBeast.img){
      c.save();
      c.globalAlpha = 0.42;
      c.drawImage(shotBeast.img, 0, 0, SHOT, SHOT);
      c.restore();

      /* 何が出たのかを画像にも残す。貼られた先で「青龍が出た」と伝わる。
         釦の手応えだけだと、画像を見返したとき何だったか分からない */
      var bp = Math.round(SHOT * 0.068);
      var by = bp + Math.round(SHOT * 0.030);
      c.save();
      c.shadowColor = 'rgba(3,5,10,.85)';
      c.shadowBlur = Math.round(SHOT * 0.016);
      c.textAlign = 'left';
      c.font = Math.round(SHOT * 0.030) + 'px ' + FONT_JA;
      c.fillStyle = 'rgba(233,220,186,.82)';
      c.fillText(shotBeast.ja, bp, by);
      var bw = c.measureText(shotBeast.ja).width;
      c.font = '300 ' + Math.round(SHOT * 0.017) + 'px ' + FONT_EN;
      c.fillStyle = 'rgba(217,196,154,.60)';
      c.fillText('   ' + shotBeast.en.split('').join(' '), bp + bw, by);
      c.restore();
    }

    /* ⑥ 文字の下地。
       前は下48%を最大94%の黒で覆っていた。五線の波はちょうどそこ(画面の高さ
       47〜93%)にあるため、波がまるごと塗り潰されていた(2026-09-18 高尾さん指摘)。
       下地は下端の帯だけに狭め、濃さも抑える。波の上に字が乗る形にする。 */
    var scTop = SHOT * 0.70;
    var sc = c.createLinearGradient(0, scTop, 0, SHOT);
    sc.addColorStop(0,    'rgba(3,5,10,0)');
    sc.addColorStop(0.42, 'rgba(3,5,10,.46)');
    sc.addColorStop(1,    'rgba(3,5,10,.86)');
    c.fillStyle = sc;
    c.fillRect(0, scTop, SHOT, SHOT - scTop);

    var pad = Math.round(SHOT * 0.068);
    var maxW = SHOT - pad * 2;
    var y = SHOT - pad;
    c.textAlign = 'left';
    c.textBaseline = 'alphabetic';

    /* 字に影を敷く。下地を薄くしたぶん、波と重なっても読めるようにする */
    c.shadowColor = 'rgba(3,5,10,.85)';
    c.shadowBlur = Math.round(SHOT * 0.018);

    // OGSの印(いちばん下)
    c.font = '300 ' + Math.round(SHOT * 0.022) + 'px ' + FONT_EN;
    c.fillStyle = 'rgba(141,130,109,.92)';
    c.fillText('OPEN GATE SUTRA'.split('').join(' '), pad, y);
    y -= Math.round(SHOT * 0.048);

    /* 題名と作者は一行にまとめる。行数を減らしたぶん、絵が見える面が広がる */
    var head = (t.title || '') + (t.artist_name ? '　／　' + t.artist_name : '');
    if (head){
      var sz2 = fitText(c, head, Math.round(SHOT * 0.034), maxW, 16);
      c.font = sz2 + 'px ' + FONT_JA;
      c.fillStyle = 'rgba(217,196,154,.88)';
      c.fillText(head, pad, y);
      y -= Math.round(sz2 * 1.80);
    }

    /* ANの一言。この画像の主役なので、いちばん大きく置く。
       長い一言は字を詰めて一行に収める(折り返すと絵を覆いすぎる) */
    if (t.tagline){
      var line = t.tagline + '。';
      var sz3 = fitText(c, line, Math.round(SHOT * 0.058), maxW, 22);
      c.font = sz3 + 'px ' + FONT_JA;
      c.fillStyle = '#e9dcba';
      c.fillText(line, pad, y);
      /* 「この曲は、」の前置きは置かない(2026-09-18 高尾さん指示)。
         一言だけが立っているほうが強い */
    }
    c.shadowBlur = 0;
    return out;
  }

  /* 画像に入れる差し色は、形のあるものから選ぶ(2026-09-18 高尾さん指示)。
     曲ごとの差し色は10種あるが、雪・星・雨・電子は粒が細かく、
     画像にすると見分けがつかなかった(実測: 雪の曲で一粒も判別できず)。
     蝶・小魚・桜・泡・波紋・落葉は形があるので、縮めても何が舞っているか分かる。

     押すたびに、その中から無作為に選ぶ(2026-09-18 高尾さん指示)。
     曲ごとに固定していたときは、105曲のうち27曲(26%)が波紋になり偏っていた。
     無作為にすれば偏りが消えるうえ、同じ曲でも押すたびに違う絵が出るので、
     「良いのが出るまで粘る」楽しみが生まれる。 */
  /* ── 幻獣(当たり) ───────────────────────────────────────────
     撮った画像に、稀に幻獣の輪が透かしで重なる(2026-09-20 高尾さん指示)。
     ガチャの当たりの手応えを作り、もう一度撮りたくさせるための仕掛け。

     絵は中央が抜けた輪の構図なので、球を囲む額になる。
     当たった1枚だけを読む(1枚あたり約500KB)。外れた回は何も読まない。

     どれが出るかは、曲の五行で決まる(2026-09-20 高尾さん指示)。
     APIが曲ごとの五行を合計100の割合で返すので、その割合で引く。
     激しい曲なら朱雀が、静かな曲なら玄武が出やすい。

     一番強い元素だけを使う手もあるが、それは採らなかった。
     いまの五行は既存曲の曲評から後付けした仮の値で、偏っている。
     一番強い元素で決めると、実測で 白虎49.7% / 麒麟1.0% となり、
     麒麟がほとんど現れない(2026-09-20 実測・105曲)。
     5つの点数すべてを使って引けば 白虎29.9% / 麒麟15.6% に収まり、
     しかも同じ曲でも引くたびに違う幻獣が出る(2026-09-20 実測)。

     黄龍だけは五行の外。当たりの5%をこれが上書きする。
     全体で見ると 0.6%(約170回に1回)の大当たり。 */
  var BEAST_CHANCE = 0.12;       // 撮って当たる確率
  var KORYU_SHARE  = 0.05;       // 当たりのうち、黄龍になる割合
  var FIVE = ['wood', 'fire', 'earth', 'metal', 'water'];
  var ELEMENT_BEAST = {
    wood:  { slug: 'seiryu', ja: '青龍', en: 'SEIRYU' },
    fire:  { slug: 'suzaku', ja: '朱雀', en: 'SUZAKU' },
    earth: { slug: 'kirin',  ja: '麒麟', en: 'KIRIN'  },
    metal: { slug: 'byakko', ja: '白虎', en: 'BYAKKO' },
    water: { slug: 'genbu',  ja: '玄武', en: 'GENBU'  }
  };
  var KORYU = { slug: 'koryu', ja: '黄龍', en: 'KORYU' };
  var beastCache = {};
  var shotBeast = null;          // 今から撮る1枚に重ねる幻獣。撮り終えたら消す

  function beastBySlug(slug){
    if (slug === KORYU.slug) return KORYU;
    for (var k in ELEMENT_BEAST) if (ELEMENT_BEAST[k].slug === slug) return ELEMENT_BEAST[k];
    return null;
  }

  function rollBeast(track){
    if (Math.random() >= BEAST_CHANCE) return null;
    if (Math.random() < KORYU_SHARE) return KORYU;

    /* 曲の五行で引く。五行が無い曲(APIが古い・まだ点いていない)は、
       5つを等しく扱う。当たりが出ないより、何か出たほうがよい */
    var fe = (track && track.five_elements) || null;
    var w = [], tot = 0, i, v;
    for (i = 0; i < FIVE.length; i++){
      v = fe ? Math.max(0, Number(fe[FIVE[i]]) || 0) : 1;
      w.push(v); tot += v;
    }
    if (tot <= 0){ w = [1, 1, 1, 1, 1]; tot = 5; }
    var x = Math.random() * tot;
    for (i = 0; i < FIVE.length; i++){
      x -= w[i];
      if (x < 0) return ELEMENT_BEAST[FIVE[i]];
    }
    return ELEMENT_BEAST[FIVE[FIVE.length - 1]];
  }

  /* 絵は自分の所に置いてあるので、印(crossOrigin)は要らない。
     読めなければ何も重ねない。当たりを逃すだけで、保存は必ず成る */
  function loadBeast(b){
    if (beastCache[b.slug]) return Promise.resolve(beastCache[b.slug]);
    return new Promise(function(res){
      var im = new Image();
      im.onload = function(){ beastCache[b.slug] = im; res(im); };
      im.onerror = function(){ res(null); };
      im.src = 'assets/beasts/' + b.slug + '.webp';
    });
  }

  var SHOT_ACCENT = {
    sei: ['sakura', 'bubbles', 'ripple'],      // 静: 桜・泡・波紋
    do:  ['butterfly', 'leaves', 'fish']       // 動: 蝶・落葉・小魚
  };
  function shotAccentFor(track){
    var list = SHOT_ACCENT[track.axis === 'do' ? 'do' : 'sei'];
    return list[Math.floor(Math.random() * list.length) % list.length];
  }

  /* 画像を撮る間だけ、球を完成した姿(飽和)に据える(2026-09-18 高尾さん指示)。
     普段の球は曲の進みに連れて育ち、崩れ、散る。押した時が散った後だと、
     持ち帰る画像に何も写っていない。シェアする絵は、いつ押しても完成形にする。
     終わったら元の段階へ戻すので、聞いている画面は乱れない。 */
  var shotFreeze = false;
  var SATURATION = 12.0;              // 12 % 8 = 4 = 飽和

  function withFullSphere(fn){
    var lb = window.__livingBG;
    if (!lb){ return Promise.resolve(fn()); }
    var before = lb.phase;
    shotFreeze = true;
    lb.phase = SATURATION;

    /* 差し色(蝶・小魚・桜・泡・波紋・雪・星・雨・落葉・電子)も一緒に出す
       (2026-09-18 高尾さん指示)。普段は曲の後半にだけ現れるので、
       前半で押すと画像に何も舞っていない。
       setWeather は始まりの時刻を6秒前に置く作りなので、撒き直した粒も
       「すでに舞っている」状態で現れる。曲ごとに何が出るかは決まっている。 */
    var kind = current ? shotAccentFor(current) : null;
    if (kind){ try { lb.setWeather(kind); } catch (e) {} }

    /* 球も差し色も自前の描画の輪で動くので、据えた姿が絵に出るまで待つ。
       待たずに撮ると、前の段階のままの球と、撒いたばかりの粒が写る */
    return new Promise(function(res){
      var k = 0;
      (function step(){
        if (++k < 14) return requestAnimationFrame(step);
        var r = fn();
        lb.phase = before;            // 元の段階へ戻す
        // 差し色も元へ。曲の後半なら出したまま、前半なら消す
        try { lb.setWeather(accentOn && current ? accentFor() : 'none'); } catch (e) {}
        shotFreeze = false;
        res(r);
      })();
    });
  }

  var btnShot = document.getElementById('btnShot');

  var SITE = 'https://teng3333.github.io/heart-sutra-archive';

  /* 撮るところまでを一本にまとめる。保存とSNSで同じ絵を使うため。
     幻獣の抽選もここで行うので、SNSへ出した絵にも当たりが乗る */
  function makeShot(){
    var t = current || {};
    var wait = (document.fonts && document.fonts.ready) || Promise.resolve();
    var rolled = rollBeast(current);
    shotBeast = null;
    return wait.then(function(){
      if (!rolled) return null;
      return loadBeast(rolled).then(function(im){
        if (im) shotBeast = { img: im, ja: rolled.ja, en: rolled.en };
      });
    }).then(function(){
      return withFullSphere(buildShot);
    }).then(function(out){
      return new Promise(function(res, rej){
        out.toBlob(function(blob){
          if (!blob){ rej(new Error('no blob')); return; }
          var name = ('ogs-' + (t.id || '') + '-' + (t.title || 'track'))
            .replace(/[^\w぀-ヿ一-鿿-]+/g, '_').slice(0, 60)
            + (shotBeast ? '-' + shotBeast.en.toLowerCase() : '') + '.png';
          res({ blob: blob, name: name, track: t });
        }, 'image/png');
      });
    });
  }

  function download(blob, name){
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 20000);   // すぐ消すと間に合わない端末がある
  }

  /* SNSへ渡す文。曲ページ側と同じ形にする(tools/build_track_pages.py の share_text) */
  function shotText(t){
    var head = t.tagline ? t.tagline + '\n\n' : '';
    return head + (t.title || '') + ' ／ ' + (t.artist_name || 'unknown') + '\n' +
           SITE + '/t/' + t.id + '.html\n\n#般若心経 #HeartSutra #OpenGateSutra';
  }

  /* ── 撮った絵をそのままSNSへ ──────────────────────────────
     Xは文字とURLしか受け取れない。画像を添えることはWebからはできない。
     ただし曲ページ(t/<id>.html)はカードの札を持っているので、
     URLを載せるだけでジャケット付きの投稿になる。まずこれを確実に届ける。

     撮った絵(幻獣が出ることがある)は、その上に添えるもの。
     クリップボードに載せられれば貼るだけ、拒まれたら保存に戻す。 */
  var btnShare = document.getElementById('btnShare');

  function shareShot(){
    var label = btnShare.textContent;
    var t = current || {};
    var text = shotText(t);
    var tweet = 'https://x.com/intent/post?text=' + encodeURIComponent(text);
    var handheld = matchMedia('(pointer: coarse)').matches;

    btnShare.disabled = true;
    btnShare.textContent = 'Preparing…';
    function back(msg, hold){
      btnShare.textContent = msg || label;   // 空にすると釦が消えたように見える
      shotBeast = null;
      setTimeout(function(){
        btnShare.textContent = label; btnShare.disabled = false;
      }, hold || 1800);
    }

    var shot = makeShot();        // 押されたその場で走らせ始める

    /* ── パソコン ──────────────────────────────────────────
       小さな案内を出して、自分でリンクを探して押してもらう形だった。
       それでは「押しても何も起きない」と同じ(2026-09-21 高尾さん指摘)。
       押したらXの投稿画面をその場で開く。これが共有釦の仕事。

       順番が要る。クリップボードへの書き込みを先に呼ぶ。
       window.open が先だと、押された勢いを使い切ってしまう。
       またSafariは書き込みを「操作の直後」しか許さないので、絵の完成は待てない。
       ClipboardItem に「あとで届く画像」を約束のまま渡す(Safariが認めた書き方)。 */
    if (!handheld){
      var onClip = (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write)
        ? navigator.clipboard.write([
            new ClipboardItem({ 'image/png': shot.then(function(s){ return s.blob; }) })
          ]).then(function(){ return true; }, function(){ return false; })
        : Promise.resolve(false);

      var win = window.open(tweet, '_blank');
      if (win) { try { win.opener = null; } catch (e) {} }

      return shot.then(function(s){
        return onClip.then(function(ok){
          var hit = shotBeast ? shotBeast.ja + ' ✦ ' : '';
          if (!ok) download(s.blob, s.name);        // 載せられなければ保存に戻す
          var head = hit + (win ? '𝕏 の投稿画面を開きました。' : '');
          var how  = ok ? '投稿欄で貼り付け（⌘V / Ctrl+V）すると画像が付きます。'
                        : '画像を保存しました。投稿欄へ引き入れると画像が付きます。';
          // 塞がれていたら、リンクだけが頼り
          var link = win ? '' :
            '<a href="' + tweet + '" target="_blank" rel="noopener noreferrer">𝕏 を開く</a> → ';
          say((head ? '<b>' + head + '</b><br>' : '') + link + how);
          back(hit || 'Shared ✓', hit ? 3200 : 2600);
        });
      }).catch(function(){ back('Share failed'); });
    }

    /* ── スマホ ────────────────────────────────────────────
       OSの共有板なら、画像も文章も一度にXへ渡る。ここが本命の道 */
    return shot.then(function(s){
      var hit = shotBeast ? shotBeast.ja + ' ✦ ' : '';
      var file = null;
      try { file = new File([s.blob], s.name, { type: 'image/png' }); } catch (e) {}

      if (file && navigator.canShare && navigator.canShare({ files: [file] })){
        return navigator.share({ files: [file], text: text })
          .then(function(){ back(hit || 'Shared ✓', hit ? 2800 : 1800); })
          .catch(function(){ back(''); });      // 取り消しただけかもしれない。責めない
      }

      // 共有板を持たない端末。保存して、行き先だけ出す
      download(s.blob, s.name);
      say('<b>' + hit + '画像を保存しました。</b><br>' +
          '<a href="' + tweet + '" target="_blank" rel="noopener noreferrer">𝕏 を開く</a>' +
          ' → 保存した画像を投稿欄へ。');
      back(hit || 'Saved ✓', hit ? 2800 : 2600);
    }).catch(function(){ back('Share failed'); });
  }
  btnShare.addEventListener('click', shareShot);

  function saveShot(){
    var label = btnShot.textContent;
    btnShot.disabled = true;
    btnShot.textContent = 'Saving…';
    /* 字の形が揃うのを待つ。待たずに書くと、本文が明朝になる前に
       別の字で焼き付いてしまうことがある */
    var wait = (document.fonts && document.fonts.ready) || Promise.resolve();

    /* 撮る前に一度だけ引く。当たったら、その1枚を読んでから撮る。
       外れた回は何も読まないので、待ち時間も通信も増えない */
    var rolled = rollBeast(current);
    shotBeast = null;

    wait.then(function(){
      if (!rolled) return null;
      return loadBeast(rolled).then(function(im){
        if (im) shotBeast = { img: im, ja: rolled.ja, en: rolled.en };
      });
    }).then(function(){
      return withFullSphere(buildShot);       // 球を完成させてから撮る
    }).then(function(out){
      out.toBlob(function(blob){
        if (!blob){ done('Save failed'); return; }
        var t = current || {};
        var name = ('ogs-' + (t.id || '') + '-' + (t.title || 'track'))
          .replace(/[^\w぀-ヿ一-鿿-]+/g, '_').slice(0, 60)
          + (shotBeast ? '-' + shotBeast.en.toLowerCase() : '') + '.png';
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        // すぐ消すと保存が間に合わない端末がある
        setTimeout(function(){ URL.revokeObjectURL(url); }, 20000);
        /* 当たりは釦で報せる。ここが「引けた」瞬間になる。
           画像を開くまで気づかないと、当たった手応えが消える */
        if (shotBeast) done(shotBeast.ja + ' ✦', 2800);
        else done('Saved ✓');
      }, 'image/png');
    }).catch(function(){ done('Save failed'); });

    function done(msg, hold){
      btnShot.textContent = msg;
      shotBeast = null;                 // 次の一枚に持ち越さない
      setTimeout(function(){
        btnShot.textContent = label; btnShot.disabled = false;
      }, hold || 1800);
    }
  }
  btnShot.addEventListener('click', saveShot);
  /* 調整・検証用。見た目には関係しない。
     保存と同じ道(球を完成させてから撮る)を通すので、
     ここで確かめた絵と、実際に落ちる画像が食い違わない */
  window.__ogsShot = function(slug){
    /* slug を渡すと、その幻獣が出た場合の絵を作る(当たりを待たずに確かめる用) */
    var b = beastBySlug(slug);
    if (!b){ shotBeast = null; return withFullSphere(buildShot); }
    return loadBeast(b).then(function(im){
      shotBeast = im ? { img: im, ja: b.ja, en: b.en } : null;
      return withFullSphere(buildShot).then(function(out){ shotBeast = null; return out; });
    });
  };

  /* ジャケットは押した人だけに大きく見せる。画面を占める見せ方はしない */
  artImg.addEventListener('error', function(){ artBtn.hidden = true; });
  artBtn.addEventListener('click', function(){
    if (!artImg.getAttribute('src')) return;
    artFullImg.src = artImg.src;
    artFullImg.alt = artImg.alt;
    artFull.hidden = false;
  });
  artFull.addEventListener('click', function(){ artFull.hidden = true; });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && !artFull.hidden) artFull.hidden = true;
  });

  anBtn.addEventListener('click', function(){
    var on = ticker.classList.toggle('on');
    document.querySelector('.stage').classList.toggle('an-on', on);
    anBtn.setAttribute('aria-pressed', String(on));
    ticker.classList.remove('open','paused');
    if (on) restartFlow();
  });

  /* 流れる文字は読みにくい。タップで止めて全文を出す */
  var track = document.getElementById('tickTrack');
  function toggleOpen(){
    var open = ticker.classList.toggle('open');
    ticker.classList.toggle('paused', open);
  }
  track.addEventListener('click', toggleOpen);
  track.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggleOpen(); }
  });

  document.getElementById('btnNext').addEventListener('click', function(){ wakeAudioFromTap(); next(); });
  document.getElementById('btnPrev').addEventListener('click', prev);

  /* 手を離して聴いている画面なので、鍵盤でも送れるようにする。
     入力欄にいるときは邪魔しない */
  document.addEventListener('keydown', function(e){
    if (!np.classList.contains('on')) return;
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    if (e.key === 'ArrowRight'){ e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft'){ e.preventDefault(); prev(); }
    else if (e.key === ' '){ e.preventDefault(); togglePlay(); }
  });
  document.getElementById('btnPlay').addEventListener('click', togglePlay);
  document.getElementById('btnGate').addEventListener('click', function(){
    audio.pause();
    np.classList.remove('on');
    showLyrics(false);
    artFull.hidden = true;
    document.querySelector('.stage').classList.remove('playing','an-on');
    document.documentElement.style.setProperty('--breath','1');
    document.documentElement.style.setProperty('--glow','1');
    if (wctx) wctx.clearRect(0, 0, ww, wh);
    accentOn = false;
    motion = null;
    try {
      if (window.__livingBG){
        window.__livingBG.setWeather('none');
        window.__livingBG.setMotion({ spin:1, tilt:1, swellAmp:1, swellRate:1,
                                      scale:1, hue:0 });
      }
    } catch (e) {}
    ticker.classList.remove('on','open');
    anBtn.setAttribute('aria-pressed','false');
    gates.style.display = '';
    say('Choose a gate, and it plays.<br><span style="color:var(--washi)">門を選ぶと、流れ始めます。</span>');
    try { if (window.__livingBG) window.__livingBG.resume(); } catch(e){}
  });

  audio.addEventListener('ended', next);
  audio.addEventListener('play',  function(){
    if (unlocking) return;          // 解錠の無音。画面には出さない
    syncPlayBtn();
    startVisual();
    say('');
  });
  audio.addEventListener('pause', function(){
    if (unlocking) return;          // 解錠の無音。画面には出さない
    syncPlayBtn();
    if (wctx) wctx.clearRect(0, 0, ww, wh);
  });
  /* 1曲読めなくても止めない */
  /* CORSで読めないと、曲そのものが鳴らせない。波を諦めてでも曲を優先する。
     配信元の許可が外れた日に、PCだけ無音になるのを防ぐ(2026-09-26) */
  audio.addEventListener('error', function(){
    if (!corsOff && audio.crossOrigin === 'anonymous' && current && current.audio_url){
      corsOff = true;
      audio.crossOrigin = null;
      analyser = null;                 // 解析は諦める。波は合成に戻る
      audio.src = current.audio_url;
      audio.play().catch(function(){ syncPlayBtn(); });
      return;
    }
    if (queue.length) next();
  });

  /* 曲のページから「聴く」で来たとき。その曲から始め、続けて同じ棚を流す。
     曲ごとに再生画面を作らず、この画面ひとつに集める。直す場所を一か所に保つため */
  var TRACK_API = API.replace('/api/shelf/', '/api/track/');
  /* axis を渡すと、その棚で続ける(2026-09-22)。
     渡さないとその曲の主たる棚になるので、瞑から渡した住所が
     受け取った側では静や動の棚になってしまう */
  function startWithTrack(id, axis){
    /* この1曲だけ、球の中心をジャケットにする(2026-09-17 高尾さん指示)。
       ここから同じ棚へ流れ続けるので、次の曲に移った時点でANへ戻す。
       SNSへ出す画面は「自分の曲」のときだけ、という境目をはっきりさせるため */
    centerArtId = id;
    say('Loading…');
    fetch(TRACK_API + id)
      .then(function(r){ if (!r.ok) throw r.status; return r.json(); })
      .then(function(t){
        curAxis = axis || t.axis;
        return fetchTracks(curAxis).then(function(d){
          var rest = (d.items || []).filter(function(x){ return x.audio_url && x.id !== t.id; });
          queue = [t].concat(shuffle(rest)); pos = -1;
          gates.style.display = 'none';
          np.classList.add('on');
          document.querySelector('.stage').classList.add('playing');
          say('');
          next();
        });
      })
      .catch(function(code){
        if (code === 404){
          say('<b>Not in the hall.</b><br>この曲は堂にありません。門を選ぶと、流れ始めます。');
          return;
        }
        sayRetry('<b>Could not reach the hall.</b><br>つながりませんでした。',
                 function(){ startWithTrack(id, curAxis); });
      });
  }

  var params = new URLSearchParams(location.search);
  var trackParam = params.get('track');
  var q = params.get('gate');
  if (q === 'dou') q = 'do';
  var fromTrack = trackParam && /^\d+$/.test(trackParam) && !DEMO;
  var fromGate = (q === 'sei' || q === 'do' || q === 'all' || q === 'mei' || q === 'contest');
  if (fromTrack || fromGate){
    /* ホームの門から来た人に、ここでもう一度門を見せない。
       棚の一覧を取り終えるまで門が出たままで、「また門が出た」と見えていた(2026-09-16) */
    gates.style.display = 'none';
    say('Opening…<br>門を開いています。');
  }
  if (fromTrack) startWithTrack(+trackParam, fromGate ? q : null);
  else if (fromGate) start(q);
})();
</script>
</body>
</html>
